<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stitch</title>
<meta name="description" content="A daily goal tracker: check in, watch the cloth fill in, review weekly.">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11142A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stitch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --plane: #EEF0F6;
  --surface: #F9FAFD;
  --ink: #1A2150;
  --ink-2: #474D6E;
  --muted: #646985;
  --hair: #D5D9E8;
  --base: #B4B9D0;
  --stitch: #9EA6C7;
  --accent: #2B3A8F;
  --accent-ink: #FFFFFF;
  --accent-wash: #DFE4F6;
  --heat-1: #C9D1EE;
  --heat-2: #8E9DDA;
  --heat-3: #4E62B8;
  --heat-4: #24317A;
  --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --g4: #eda100;
  --g5: #e87ba4; --g6: #008300; --g7: #6250d6; --g8: #e34948;
  --good-ink: #1F6B3A;
  --shadow: 0 10px 30px rgba(26,33,80,.16);
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #11142A; --surface: #191D37; --ink: #E7E9F4; --ink-2: #BABED7; --muted: #8D92B0;
    --hair: #2C3154; --base: #3D4370; --stitch: #4B5283; --accent: #A9B6F5; --accent-ink: #11142A;
    --accent-wash: #262C55;
    --heat-1: #2E3870; --heat-2: #4558B0; --heat-3: #7486DA; --heat-4: #B3C0F4;
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500;
    --g5: #d55181; --g6: #008300; --g7: #9085e9; --g8: #e66767;
    --good-ink: #6CCB8C;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #11142A; --surface: #191D37; --ink: #E7E9F4; --ink-2: #BABED7; --muted: #8D92B0;
  --hair: #2C3154; --base: #3D4370; --stitch: #4B5283; --accent: #A9B6F5; --accent-ink: #11142A;
  --accent-wash: #262C55;
  --heat-1: #2E3870; --heat-2: #4558B0; --heat-3: #7486DA; --heat-4: #B3C0F4;
  --g1: #3987e5; --g2: #d95926; --g3: #199e70; --g4: #c98500;
  --g5: #d55181; --g6: #008300; --g7: #9085e9; --g8: #e66767;
  --good-ink: #6CCB8C;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 400 17px/1.5 var(--body);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--hair);
  padding-top: env(safe-area-inset-top);
}
.top-in { max-width: 680px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { width: 24px; height: 24px; }
.tabs { display: none; gap: 2px; }
.tabs a, .bottom a {
  text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: 15px;
  padding: 8px 12px; border-radius: 8px;
}
.tabs a[aria-current="page"] { color: var(--ink); background: var(--accent-wash); }
.sync {
  display: inline-flex; align-items: center; gap: 7px; border: 0; background: none;
  font-size: 13px; color: var(--muted); padding: 6px 4px; cursor: pointer;
}
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--base); display: inline-block; }
.sync[data-s="ok"] i { background: var(--g3); }
.sync[data-s="syncing"] i, .sync[data-s="pending"] i { background: var(--g4); }
.sync[data-s="error"] i { background: var(--g8); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--ink-2);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: var(--accent-wash); }
.icon-btn svg { width: 22px; height: 22px; }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--hair);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.bottom a { text-align: center; padding: 10px 4px; font-size: 14px; }
.bottom a[aria-current="page"] { color: var(--ink); background: var(--accent-wash); }
@media (min-width: 760px) {
  .tabs { display: flex; }
  .bottom { display: none; }
  body { padding-bottom: 48px; }
}

main { max-width: 680px; margin: 0 auto; padding: 20px 16px 24px; }
h1 { font: 700 clamp(34px, 8vw, 48px)/1.02 var(--display); letter-spacing: -0.03em; margin: 8px 0 18px; }
h2 { font: 700 23px/1.15 var(--display); letter-spacing: -0.015em; margin: 36px 0 10px; }
h3 { font: 700 18px/1.25 var(--display); margin: 0; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.ink2 { color: var(--ink-2); }

/* ---------- buttons & fields ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--base); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px;
  text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; background: none; color: var(--accent); padding: 0 8px; }
.btn.quiet:hover { background: var(--accent-wash); }
.btn.danger { color: #B3261E; }
:root[data-theme="dark"] .btn.danger { color: #FF8A80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #FF8A80; } }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.f { display: block; margin: 0 0 14px; }
label.f > span { display: block; font-weight: 700; font-size: 15px; margin-bottom: 5px; }
label.f > small { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
input[type=text], input[type=number], input[type=password], input[type=date], textarea, select {
  width: 100%; border: 1.5px solid var(--base); border-radius: 10px; background: var(--surface);
  padding: 10px 12px; font-size: 16px; min-height: 44px;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
input:focus, textarea:focus, select:focus, input:focus-visible, textarea:focus-visible, select:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }
.seg { display: inline-flex; border: 1.5px solid var(--base); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: block; padding: 9px 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: -4px; }

/* ---------- notes / banners ---------- */
.note {
  border-left: 3px solid var(--accent); background: var(--accent-wash);
  padding: 12px 14px; border-radius: 0 10px 10px 0; margin: 0 0 18px;
}
.note p:last-child { margin-bottom: 0; }
.note .row { margin-top: 10px; }

/* ---------- today ---------- */
.dayhead { display: flex; align-items: flex-end; gap: 8px; }
.dayhead h1 { margin-right: auto; }
.dayhead h1 small { display: block; font: 400 17px/1.4 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 6px; }
.cloth-fig { margin: 0 0 22px; }
.cloth-fig figcaption { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); font-size: 15px; margin-top: 8px; flex-wrap: wrap; }
.cloth-fig figcaption b { font: 700 19px/1 var(--display); color: var(--ink); }

.checkin { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.goal-row {
  display: grid; grid-template-columns: 6px 1fr auto; gap: 4px 14px;
  padding: 16px 0; border-bottom: 1px solid var(--hair);
}
.thread { grid-row: 1 / span 3; border-radius: 3px; background: var(--g); align-self: stretch; }
.gr-name { font: 700 19px/1.2 var(--display); }
.gr-bet { color: var(--ink-2); font-size: 15px; margin-top: 3px; }
.gr-val { text-align: right; font: 700 19px/1.2 var(--display); white-space: nowrap; }
.gr-val.zero { color: var(--muted); font-weight: 500; }
.gr-ctl { grid-column: 2 / span 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.chip {
  min-width: 52px; min-height: 40px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--base); background: var(--surface); font-weight: 700; font-size: 15px;
}
.chip:hover { border-color: var(--g); }
.chip.on { background: color-mix(in srgb, var(--g) 22%, var(--surface)); border-color: var(--g); color: var(--ink); }
.chip.text { border-color: transparent; background: none; color: var(--accent); min-width: 0; padding: 0 8px; }
.chip.text:hover { background: var(--accent-wash); }
.gr-ctl .amt-input { width: 96px; min-height: 40px; padding: 6px 10px; }
.gr-note { grid-column: 2 / span 2; margin-top: 8px; }
.gr-note textarea { min-height: 64px; font-size: 15px; }
.gr-note .saved-note { color: var(--ink-2); font-size: 15px; font-style: italic; margin: 6px 0 0; white-space: pre-wrap; }

/* ---------- cloth & charts ---------- */
svg.cloth { display: block; overflow: visible; }
.cloth .c-empty { fill: none; stroke: var(--stitch); stroke-width: 1.3; stroke-dasharray: 3.2 2.4; }
.cloth .c-future { opacity: .35; }
.cloth .h1 { fill: var(--heat-1); } .cloth .h2 { fill: var(--heat-2); }
.cloth .h3 { fill: var(--heat-3); } .cloth .h4 { fill: var(--heat-4); }
.cloth .c-today { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.cloth text, .chart text { fill: var(--muted); font: 400 12px var(--body); }
.cloth .fresh { animation: stitch-in .7s cubic-bezier(.2,.8,.2,1.2); transform-box: fill-box; transform-origin: center; }
@keyframes stitch-in { from { transform: scale(.2) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cloth .fresh { animation: none; } }
.legend { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.legend svg { display: block; }

.chart { display: block; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--hair); stroke-width: 1; }
.chart .axis { stroke: var(--base); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--g); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ms { fill: var(--g); stroke: var(--surface); stroke-width: 2; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; opacity: 0; }
.chart .xdot { fill: var(--g); stroke: var(--surface); stroke-width: 2; opacity: 0; }
.chart.hover .xhair, .chart.hover .xdot { opacity: 1; }
.chart .ticks { font-variant-numeric: tabular-nums; }
.chart-wrap { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 14px 8px; }

.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px 14px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.filters button { flex: none; }
.filters .chip { --g: var(--accent); }
.filters .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gc); margin-right: 6px; vertical-align: 1px; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--hair); margin: 6px 0 0; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--hair); }
.stat b { display: block; font: 700 30px/1.05 var(--display); letter-spacing: -0.02em; }
.stat span { font-size: 14px; color: var(--ink-2); }

.goal-sec { margin-top: 34px; }
.goal-sec header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.goal-sec header .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--g); flex: none; align-self: center; }
.goal-sec header h2 { margin: 0; }
.goal-sec header p { margin: 0 0 0 auto; color: var(--ink-2); font-size: 15px; }

#tip {
  position: fixed; z-index: 50; pointer-events: none; max-width: 260px;
  background: var(--ink); color: var(--plane); border-radius: 8px; padding: 8px 10px;
  font-size: 14px; line-height: 1.4; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s;
}
#tip.show { opacity: 1; }
#tip b { display: block; }

/* ---------- goals ---------- */
.glist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.gitem { border-bottom: 1px solid var(--hair); }
.ghead {
  width: 100%; display: grid; grid-template-columns: 6px 1fr auto; gap: 2px 14px; text-align: left;
  padding: 16px 0; border: 0; background: none; cursor: pointer;
}
.ghead .thread { grid-row: 1 / span 2; }
.ghead .meta { color: var(--ink-2); font-size: 15px; }
.ghead .tag { color: var(--muted); font-size: 14px; align-self: start; padding-top: 4px; }
.gbody { padding: 0 0 22px 20px; }
.gbody h3 { margin: 22px 0 8px; }
.bet-now { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 14px; }
.bet-now .bet-text { font: 700 18px/1.3 var(--display); }
.history { list-style: none; padding: 0; margin: 0; }
.history li { padding: 10px 0 10px 16px; border-left: 2px solid var(--hair); margin-left: 4px; position: relative; }
.history li::before { content: ""; position: absolute; left: -6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--base); }
.history li.worked::before { background: var(--g); border-color: var(--g); }
.history li.dead::before { border-style: dashed; border-color: var(--ink-2); }
.history .when { color: var(--muted); font-size: 14px; }
.history .what { font-weight: 700; }
.history .lesson { color: var(--ink-2); font-size: 15px; margin-top: 2px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; inset: 0; }
.swatches span { display: block; width: 34px; height: 34px; border-radius: 50%; background: var(--g); border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--base); cursor: pointer; }
.swatches input:checked + span { box-shadow: 0 0 0 3px var(--ink); }
.swatches label.auto span { width: auto; height: 34px; border-radius: 999px; padding: 0 14px; display: flex; align-items: center; font-weight: 700; font-size: 15px; border: 1.5px solid var(--base); box-shadow: none; background: var(--surface); color: var(--ink); }
.swatches label.auto input:checked + span { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); }
.swatches input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 3px; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 16px; margin: 12px 0; }

/* ---------- review ---------- */
.weeknav { display: flex; align-items: center; gap: 6px; margin: -6px 0 18px; }
.weeknav strong { font-weight: 700; margin: 0 4px; }
.wk { list-style: none; margin: 0 0 6px; padding: 0; }
.wk li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--hair); }
.wk .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.wk .nm i { width: 10px; height: 10px; border-radius: 3px; background: var(--g); flex: none; }
.wk .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.wk .days { display: flex; gap: 4px; }
.wk .days b { width: 16px; height: 16px; border-radius: 3px; border: 1.3px dashed var(--stitch); }
.wk .days b.on { background: var(--g); border: 0; }
.wk .tot { min-width: 64px; text-align: right; color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.wk-days-head { display: flex; gap: 4px; }
.wk-days-head b { width: 16px; text-align: center; font-size: 11px; color: var(--muted); font-weight: 400; }
.gmap { margin: 0 0 22px; }
.gmap ul { list-style: none; margin: 0; padding: 0; }
.gmap ul ul { margin: 2px 0 6px 6px; padding-left: 16px; border-left: 1.5px dashed var(--stitch); }
.gmap li { margin: 2px 0; }
.mapbtn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 4px; cursor: pointer; font-weight: 700; font-size: 16px; border-radius: 6px; text-align: left; }
.gmap > ul > li > .mapbtn { font: 700 19px/1.2 var(--display); }
.mapbtn:hover { background: var(--accent-wash); }
.mapbtn i, .lchip i, .pick i { width: 10px; height: 10px; border-radius: 3px; background: var(--g); flex: none; display: inline-block; }
.mapbtn.done span { color: var(--ink-2); }
.gmap .also { display: block; font-size: 13px; color: var(--muted); margin: -4px 0 4px 26px; line-height: 1.35; }
.lchip.implied { border-style: dashed; opacity: .75; }
.lchip small { font-weight: 400; color: var(--muted); }
.ghead { scroll-margin-top: 80px; }
dl.links { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; align-items: baseline; }
dl.links dt { color: var(--muted); font-size: 14px; }
dl.links dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.lchip { display: inline-flex; align-items: center; border: 1.5px solid var(--base); border-radius: 999px; background: var(--surface); overflow: hidden; }
.lchip button { border: 0; background: none; cursor: pointer; font-size: 15px; font-weight: 700; padding: 5px 4px 5px 10px; display: inline-flex; align-items: center; gap: 7px; }
.lchip button.x { padding: 5px 10px 5px 6px; color: var(--muted); font-weight: 400; font-size: 17px; line-height: 1; }
.lchip button.x:hover { color: var(--ink); }
.linkform select { width: auto; flex: 1 1 140px; min-width: 0; }
.linkform select[name=kind] { flex: 0 1 auto; }
fieldset.picker { border: 0; padding: 0; margin: 0 0 16px; }
fieldset.picker legend { font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 2px; }
fieldset.picker small { display: block; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick label { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; }
.pick span { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1.5px solid var(--base); border-radius: 999px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--surface); }
.pick input:checked + span { border-color: var(--g); background: color-mix(in srgb, var(--g) 18%, var(--surface)); }
.pick input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
h2.sub { font-size: 19px; margin: 26px 0 8px; }
.qlog { position: sticky; top: calc(61px + env(safe-area-inset-top)); z-index: 10; display: flex; align-items: center; gap: 8px;
  margin: 0 -16px 18px; padding: 8px 16px; background: color-mix(in srgb, var(--plane) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.qlog > svg { position: absolute; left: 30px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.qlog input { flex: 1; padding-left: 40px; border-radius: 999px; }
.qlog input::-webkit-search-cancel-button { display: none; }
.qlog .icon-btn { position: absolute; right: 20px; width: 36px; height: 36px; }

<script>
(() => {
'use strict';

/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return dstr(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dstr(d); };
const fmtD = (s, o = { month: 'short', day: 'numeric' }) => parse(s).toLocaleDateString(undefined, o);
const fmtLong = s => parse(s).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const tsDate = ts => dstr(new Date(ts));
const monthKey = s => s.slice(0, 7);

function stable(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}

/* ================= state ================= */
const LS_STATE = 'stitch.state.v1';
const LS_CFG = 'stitch.cfg.v1';
const LS_UI = 'stitch.ui.v1';
const COLS = ['goals', 'logs', 'bets', 'wins', 'reviews', 'ideas', 'links', 'dismissed'];
const emptyState = () => ({ version: 1, goals: {}, logs: {}, bets: {}, wins: {}, reviews: {}, ideas: {}, links: {}, dismissed: {}, settings: { ideaThreshold: 20, updatedAt: 0 } });
const LS_SUGG = 'stitch.suggestions.v1';

function normalize(s) {
  const e = emptyState();
  if (!s || typeof s !== 'object') return e;
  for (const c of COLS) if (s[c] && typeof s[c] === 'object') e[c] = s[c];
  if (s.settings && typeof s.settings === 'object') e.settings = Object.assign(e.settings, s.settings);
  return e;
}
function readLS(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch { return fallback; } }
function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

let state = normalize(readLS(LS_STATE, null));
let cfg = Object.assign({ owner: '', repo: 'goal-tracker-data', path: 'data.json', token: '', lastSync: 0, lastChange: 0, device: '', theme: 'auto',
  jev: false, branch: 'main', pendingSuggest: [], lastDispatch: 0, jevError: '' }, readLS(LS_CFG, {}));
let sugg = readLS(LS_SUGG, { suggestions: {}, status: null });
const NET_ERR = 'Couldn\'t reach GitHub to check for suggestions. They\'ll come through on the next sync once the connection is back.';
let jevNetFails = 0;
// older versions saved one-off network errors; clear those on load
if (/^Couldn't reach GitHub/.test(cfg.jevError || '')) cfg.jevError = '';
if (!cfg.device) { cfg.device = 'device-' + Math.random().toString(36).slice(2, 6); writeLS(LS_CFG, cfg); }
const saveCfg = () => writeLS(LS_CFG, cfg);
const saveLocal = () => writeLS(LS_STATE, state);

const live = col => Object.values(state[col]).filter(r => r && !r.deleted);
function put(col, rec) { rec.updatedAt = Date.now(); state[col][rec.id] = rec; touched(); }
function remove(col, id) { state[col][id] = { id, deleted: true, updatedAt: Date.now() }; touched(); }
function setSetting(k, v) { state.settings = { ...state.settings, [k]: v, updatedAt: Date.now() }; touched(); }
function touched() { if (typeof buildGraph === 'function') { GRAPH = buildGraph(); REDUND = null; } cfg.lastChange = Date.now(); saveCfg(); saveLocal(); scheduleSync(2500); requestRender(); }

function pick(a, b) {
  if (!a) return b; if (!b) return a;
  const ua = a.updatedAt || 0, ub = b.updatedAt || 0;
  if (ub !== ua) return ub > ua ? b : a;
  return stable(a) <= stable(b) ? a : b;
}
function merge(a, b) {
  a = normalize(a); b = normalize(b);
  const out = emptyState();
  for (const c of COLS) {
    for (const k of new Set([...Object.keys(a[c]), ...Object.keys(b[c])])) out[c][k] = pick(a[c][k], b[c][k]);
  }
  out.settings = pick(a.settings, b.settings);
  return out;
}

/* ================= derived data ================= */
const goalById = id => { const g = state.goals[id]; return g && !g.deleted ? g : null; };
const isOpen = g => !g.archived && !g.completedOn;
const activeGoals = () => live('goals').filter(isOpen).sort((a, b) => a.createdAt - b.createdAt);
// goals that belong on a given day's check-in list: open then, or a one-time goal finished that day
const goalsForDay = day => live('goals').filter(g => !g.archived && (!g.completedOn || g.completedOn >= day)).sort((a, b) => a.createdAt - b.createdAt);
const allGoals = () => live('goals').sort((a, b) => a.createdAt - b.createdAt);
const logKey = (date, gid) => `${date}|${gid}`;
const getLog = (date, gid) => { const l = state.logs[logKey(date, gid)]; return l && !l.deleted ? l : null; };

function buildIndex() {
  const byDate = new Map(), byGoal = new Map();
  for (const l of live('logs')) {
    if (!(l.amount > 0) || !goalById(l.goalId)) continue;
    if (!byDate.has(l.date)) byDate.set(l.date, []);
    byDate.get(l.date).push(l);
    if (!byGoal.has(l.goalId)) byGoal.set(l.goalId, []);
    byGoal.get(l.goalId).push(l);
  }
  return { byDate, byGoal };
}
let IDX = buildIndex();

/* ---------- goal links ----------
   contributes: from (narrower) -> to (broader). A goal can have many parents.
   mutual: two goals that feed each other; activity counts toward both.
   related: connected by topic only; nothing rolls up.
   The two symmetric types are stored once under a sorted id. */
const linkId = (type, a, b) => type === 'contributes' ? `c:${a}>${b}` : `${type === 'mutual' ? 'm' : 'r'}:${[a, b].sort().join('~')}`;
const DIRECT = 0.75;   // closeness assumed for links made by hand
function buildGraph() {
  const parents = new Map(), children = new Map(), related = new Map(), mutual = new Map(), parentLinks = new Map();
  const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); if (!m.get(k).includes(v)) m.get(k).push(v); };
  for (const l of live('links')) {
    if (!goalById(l.from) || !goalById(l.to)) continue;
    if (l.type === 'contributes') { push(parents, l.from, l.to); push(children, l.to, l.from); push(parentLinks, l.from, l); }
    else if (l.type === 'mutual') { push(mutual, l.from, l.to); push(mutual, l.to, l.from); }
    else { push(related, l.from, l.to); push(related, l.to, l.from); }
  }
  return { parents, children, related, mutual, parentLinks };
}
let GRAPH = buildGraph();
let REDUND = null;     // cache of implied links, cleared whenever links change
const parentsOf = id => GRAPH.parents.get(id) || [];
const childrenOf = id => GRAPH.children.get(id) || [];
const relatedOf = id => GRAPH.related.get(id) || [];
const mutualOf = id => GRAPH.mutual.get(id) || [];
function walk(id, next) {
  const seen = new Set(), stack = [...next(id)];
  while (stack.length) { const x = stack.pop(); if (seen.has(x) || x === id) continue; seen.add(x); stack.push(...next(x)); }
  return seen;
}
// what counts toward a goal: everything linked under it, plus goals it supports each way
const feeders = id => [...childrenOf(id), ...mutualOf(id)];
const descendants = id => walk(id, feeders);
const family = id => new Set([id, ...descendants(id)]);
const isRollup = g => g.unit === 'none' || feeders(g.id).length > 0;
const byName = (a, b) => a.name.localeCompare(b.name);
const goalNames = ids => ids.map(goalById).filter(Boolean).sort(byName).map(g => esc(g.name)).join(', ');

/* ---------- implied links (transitive reduction) ----------
   A "part of" link from A to C adds nothing when A already reaches C through other
   links (A -> B -> C): every progress count already includes it. Suggestions like that
   are hidden, and existing ones are offered for tidying. */
function upMap(extra = []) {
  const up = new Map();
  const add = (a, b, c) => { if (!up.has(a)) up.set(a, []); up.get(a).push({ to: b, c }); };
  for (const l of live('links')) {
    if (!goalById(l.from) || !goalById(l.to)) continue;
    const c = l.closeness ?? DIRECT;
    if (l.type === 'contributes') add(l.from, l.to, c);
    else if (l.type === 'mutual') { add(l.from, l.to, c); add(l.to, l.from, c); }
  }
  for (const e of extra) add(e.from, e.to, e.c);
  return up;
}
// a route from a to c that skips the direct link, using only links at least minC close;
// returns the goals in between, or null
function altPath(a, c, up, minC = 0) {
  const prev = new Map([[a, null]]), queue = [];
  for (const e of up.get(a) || []) if (e.to !== c && e.c >= minC && !prev.has(e.to)) { prev.set(e.to, a); queue.push(e.to); }
  while (queue.length) {
    const x = queue.shift();
    for (const e of up.get(x) || []) {
      if (e.c < minC) continue;
      if (e.to === c) { const p = []; for (let y = x; y !== a; y = prev.get(y)) p.unshift(y); return p; }
      if (prev.has(e.to)) continue;
      prev.set(e.to, x); queue.push(e.to);
    }
  }
  return null;
}
function redundantLinks() {
  const up = upMap(), out = [];
  for (const l of live('links')) {
    if (l.type !== 'contributes') continue;
    const a = goalById(l.from), c = goalById(l.to);
    if (!a || !c || a.archived || c.archived) continue;
    const path = altPath(l.from, l.to, up);
    if (path) out.push({ link: l, path });
  }
  return out;
}
function redundantSet() { if (!REDUND) REDUND = new Map(redundantLinks().map(r => [r.link.id, r])); return REDUND; }
const isImplied = (from, to) => redundantSet().has(linkId('contributes', from, to));
const directParents = id => parentsOf(id).filter(p => !isImplied(id, p));

/* ---------- placement and colors ----------
   Each goal sits under one main parent: the closest non-implied one (then the most
   certain, then the earliest). A goal with no parent of its own sits beside a goal it
   supports each way. On automatic color, a goal takes the color of where it sits, so a
   cluster shares its root's color. */
const isAutoColor = g => g.colorMode !== 'manual';
function mainParent(g) {
  const ls = (GRAPH.parentLinks.get(g.id) || []).filter(l => { const p = goalById(l.to); return p && !p.archived && !isImplied(g.id, l.to); });
  if (!ls.length) return null;
  ls.sort((a, b) => (b.closeness ?? DIRECT) - (a.closeness ?? DIRECT) || (b.score || 0) - (a.score || 0) || (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return goalById(ls[0].to);
}
function placementParent(g) {
  const p = mainParent(g);
  if (p) return p;
  for (const m of mutualOf(g.id).map(goalById).filter(x => x && !x.archived).sort((a, b) => a.createdAt - b.createdAt)) {
    const mp = mainParent(m);
    if (mp && mp.id !== g.id) return mp;
  }
  return null;
}
function colorSource(g, seen = new Set()) {
  if (!isAutoColor(g) || seen.has(g.id)) return null;
  seen.add(g.id);
  const p = placementParent(g);
  if (p) return p;
  const older = [...mutualOf(g.id), ...relatedOf(g.id)].map(goalById).filter(o => o && !o.archived && o.createdAt < g.createdAt).sort((a, b) => a.createdAt - b.createdAt)[0];
  return older || null;
}
function gc(g, seen = new Set()) {
  const src = colorSource(g, seen);
  return src ? gc(src, seen) : (g.color || 1);
}

function addLink(type, from, to, extra = null) {
  if (from === to) return 'A goal can\'t link to itself.';
  const existing = id => { const l = state.links[id]; return l && !l.deleted ? l : null; };
  const drop = id => { if (existing(id)) state.links[id] = { id, deleted: true, updatedAt: Date.now() }; };
  if (type === 'contributes') {
    if (walk(from, childrenOf).has(to)) return `${goalById(to).name} is already part of ${goalById(from).name}, so linking it the other way would make a loop.`;
    drop(linkId('related', from, to)); drop(linkId('mutual', from, to));
  } else if (type === 'mutual') {
    drop(linkId('contributes', from, to)); drop(linkId('contributes', to, from)); drop(linkId('related', from, to));
  } else if (existing(linkId('contributes', from, to)) || existing(linkId('contributes', to, from)) || existing(linkId('mutual', from, to))) {
    return 'These goals are already linked more closely than "related".';
  }
  const id = linkId(type, from, to);
  const [a, b] = type === 'contributes' ? [from, to] : [from, to].sort();
  const rec = { id, type, from: a, to: b, createdAt: Date.now() };
  if (extra) Object.assign(rec, extra);
  put('links', rec);
  return null;
}
// remove implied links one at a time, rechecking after each, until none are left
function tidyImplied() {
  let n = 0;
  for (let guard = 0; guard < 500; guard++) {
    const r = redundantLinks()[0];
    if (!r) break;
    state.links[r.link.id] = { id: r.link.id, deleted: true, updatedAt: Date.now() };
    n++;
  }
  if (n) touched();
  return n;
}

// a day counts for a goal when the goal or anything feeding into it was logged
function activeDays(n, gid = null, end = today()) {
  const ids = gid ? family(gid) : null;
  let c = 0;
  for (let i = 0; i < n; i++) {
    const d = addDays(end, -i);
    const ls = IDX.byDate.get(d);
    if (ls && (!ids || ls.some(l => ids.has(l.goalId)))) c++;
  }
  return c;
}
function familyStart(gid) { return [...family(gid)].map(goalById).filter(Boolean).map(goalStart).sort()[0] || today(); }
function lastActiveDate() {
  let best = null;
  for (const d of IDX.byDate.keys()) if (!best || d > best) best = d;
  return best;
}
function goalStart(g) {
  let s = tsDate(g.createdAt);
  for (const l of IDX.byGoal.get(g.id) || []) if (l.date < s) s = l.date;
  return s;
}

function unitWord(g, n) {
  let w = (g.unitLabel || 'times').trim();
  if (n === 1 && /[^s]s$/i.test(w)) w = w.slice(0, -1);
  return w;
}
function fmtAmt(g, a) {
  if (g.unit === 'none') return a ? 'Active' : 'No activity';
  if (g.unit === 'once') return a ? 'Completed' : 'Not yet';
  if (!a) return g.unit === 'check' ? 'Not yet' : g.unit === 'minutes' ? '0 min' : `0 ${unitWord(g, 0)}`;
  if (g.unit === 'minutes') return a >= 120 ? `${+(a / 60).toFixed(1)} h` : `${a} min`;
  if (g.unit === 'check') return 'Done';
  return `${a} ${unitWord(g, a)}`;
}
function fmtTotal(g, total, days) {
  if (g.unit === 'minutes') return total >= 60 ? `${+(total / 60).toFixed(1)} hours` : `${total} min`;
  if (g.unit === 'check') return `${days} ${days === 1 ? 'day' : 'days'}`;
  if (g.unit === 'none') return `${days} active ${days === 1 ? 'day' : 'days'}`;
  if (g.unit === 'once') return g.completedOn ? `completed ${fmtD(g.completedOn)}` : 'not done yet';
  return `${total} ${unitWord(g, total)}`;
}
function familyActiveTotal(gid) {
  const ids = family(gid); let n = 0;
  for (const ls of IDX.byDate.values()) if (ls.some(l => ids.has(l.goalId))) n++;
  return n;
}

/* ================= sync ================= */
class SyncError extends Error {}
let syncing = false, syncAgain = false, syncTimer = null, syncState = 'off', syncMsg = '';

const b64enc = str => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';

const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghHeaders = () => ({ Authorization: `Bearer ${cfg.token.trim()}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
const repoUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}`;
const contentsUrl = () => `${repoUrl()}/contents/${(cfg.path.trim() || 'data.json').split('/').map(encodeURIComponent).join('/')}`;
const syncReady = () => !!(cfg.token && cfg.owner && cfg.repo);

async function ghMessage(r) { try { const j = await r.json(); return j.message || ''; } catch { return ''; } }

async function checkRepo() {
  const r = await fetch(repoUrl(), { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 401) throw new SyncError('GitHub rejected the token. It may have expired. Paste a new one in Settings.');
  if (r.status === 404) throw new SyncError(`Can't see ${cfg.owner}/${cfg.repo}. Check the spelling, and that the token was given access to this repo.`);
  if (!r.ok) throw new SyncError(`GitHub returned ${r.status}: ${await ghMessage(r)}`);
  const j = await r.json();
  if (j.default_branch && j.default_branch !== cfg.branch) { cfg.branch = j.default_branch; saveCfg(); }
  return j;
}

/* ---------- Jev link suggestions ----------
   Jev doesn't accept calls from web pages, so a GitHub Action in the data repo
   calls it (the key is a repo secret) and writes suggestions.json, which we read here. */
const SUGG_PATH = 'suggestions.json';
// waiting until a run newer than our request reports back (30s of slack for clock differences)
const jevWaiting = () => cfg.jev && cfg.lastDispatch && Date.now() - cfg.lastDispatch < 4 * 60 * 1000 &&
  !(sugg.status && Date.parse(sugg.status.at) > cfg.lastDispatch - 30000);

async function fetchSuggestions() {
  const r = await fetch(`${repoUrl()}/contents/${SUGG_PATH}`, { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) return;
  if (!r.ok) return;
  const j = await r.json();
  try {
    const data = JSON.parse(j.content ? b64dec(j.content) : '{}');
    const before = stable(sugg);
    sugg = { suggestions: data.suggestions || {}, status: data.status || null };
    writeLS(LS_SUGG, sugg);
    if (stable(sugg) !== before) requestRender();
  } catch {}
}

async function dispatchSuggest(goalId) {
  const sentAt = Date.now();
  const r = await fetch(`${repoUrl()}/actions/workflows/suggest-links.yml/dispatches`, {
    method: 'POST', headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ ref: cfg.branch || 'main', inputs: { goal_id: goalId || '' } }),
  });
  if (r.status === 204 || r.ok) { cfg.lastDispatch = sentAt; cfg.jevError = ''; saveCfg(); pollSuggestions(); return true; }
  const msg = await ghMessage(r);
  cfg.jevError = r.status === 403 || r.status === 404
    ? 'GitHub wouldn\'t start the suggestion run. Give your token "Actions: Read and write" on the data repo, and check the repo has the suggest-links workflow.'
    : `GitHub returned ${r.status} when starting the suggestion run: ${msg}`;
  saveCfg(); requestRender();
  return false;
}

let pollTimer = null;
function pollSuggestions() {
  clearTimeout(pollTimer);
  if (!jevWaiting()) { requestRender(); return; }
  requestRender();
  pollTimer = setTimeout(async () => { try { await fetchSuggestions(); } catch {} pollSuggestions(); }, 15000);
}

function requestSuggestions(goalId) {
  if (!cfg.jev || !syncReady()) return;
  if (!cfg.pendingSuggest.includes(goalId)) cfg.pendingSuggest.push(goalId);
  saveCfg();
}

const pairKey = (a, b) => [a, b].sort().join('|');
const linkedEither = (a, b) => parentsOf(a).includes(b) || parentsOf(b).includes(a) || relatedOf(a).includes(b) || mutualOf(a).includes(b);
// Suggestions still open for review. A "part of" suggestion is hidden when other links or
// suggestions, each at least as close, already connect the two goals: Contest -> Writing ->
// Change the World makes a direct Contest -> Change the World link redundant.
function reviewableSuggestions() {
  const open = Object.values(sugg.suggestions || {}).filter(s => {
    const a = goalById(s.from), b = goalById(s.to);
    if (!a || !b || a.archived || b.archived) return false;
    const d = state.dismissed[s.pair || pairKey(s.from, s.to)];
    if (d && !d.deleted) return false;
    return !linkedEither(s.from, s.to);
  });
  const extra = open.filter(s => s.type === 'contributes' || s.type === 'mutual').flatMap(s => {
    const c = s.closeness ?? 0.5;
    return s.type === 'mutual' ? [{ from: s.from, to: s.to, c }, { from: s.to, to: s.from, c }] : [{ from: s.from, to: s.to, c }];
  });
  // Links you've already made always count: if they connect the pair at all, the suggestion
  // adds nothing (adding it would only put it straight onto the "links you can drop" list).
  // Other pending suggestions only count when each step is at least as close as this one.
  const upAccepted = upMap();
  const up = upMap(extra);
  const connected = (a, b) => altPath(a, b, upAccepted) || altPath(b, a, upAccepted);
  const shown = [], hidden = [];
  for (const s of open) {
    const via = connected(s.from, s.to)
      || (s.type === 'contributes' ? altPath(s.from, s.to, up, s.closeness ?? 0) : null);
    (via ? hidden : shown).push(via ? { ...s, via } : s);
  }
  const rank = s => (s.closeness ?? 0.5) * (s.p || 0);
  shown.sort((x, y) => rank(y) - rank(x));

}
function pendingSuggestions(goalId = null) {
  const { shown } = reviewableSuggestions();
  return goalId ? shown.filter(s => s.from === goalId || s.to === goalId) : shown;
}
function closenessLabel(c) {
  if (c == null) return '';
  return c >= 0.875 ? 'direct step' : c >= 0.625 ? 'close' : c >= 0.375 ? 'indirect' : 'distant';
}
function suggestionRow(s) {
  const a = goalById(s.from), b = goalById(s.to);
  const A = `<span class="sg-goal" style="--g:var(--g${gc(a)})"><i></i>${esc(a.name)}</span>`;
  const B = `<span class="sg-goal" style="--g:var(--g${gc(b)})"><i></i>${esc(b.name)}</span>`;
  const text = s.type === 'contributes' ? `${A} <span class="muted">is part of</span> ${B}`
    : s.type === 'mutual' ? `${A} <span class="muted">and</span> ${B} <span class="muted">support each other</span>`
    : `${A} <span class="muted">is related to</span> ${B}`;
  const cl = closenessLabel(s.closeness);
  const gapHint = s.type === 'contributes' && s.closeness != null && s.closeness < 0.375
    ? ' There may be a step in between that isn\'t a goal yet.' : '';
  const key = esc(s.pair || pairKey(s.from, s.to));
  return `<li><span class="sg-text">${text}
    <span class="sg-p">${Math.round((s.p || 0) * 100)}% sure${cl ? `, ${cl}` : ''}.${gapHint}</span></span>
    <span class="row"><button class="btn" data-act="sugg-add" data-pair="${key}">Add</button><button class="btn quiet" data-act="sugg-dismiss" data-pair="${key}">Dismiss</button></span></li>`;
}
function suggestionsPanel() {
  if (!cfg.jev) return '';
  const list = pendingSuggestions();
  const waiting = jevWaiting();
  const failed = cfg.jevError || (sugg.status && !sugg.status.ok ? sugg.status.message : '');
  if (!list.length && !waiting && !failed) return '';
  let h = `<section class="sugg"><h2 class="sub">Suggested links</h2>`;
  if (waiting) h += `<p class="small ink2">Asking Jev how your new goal fits with the others. This usually takes under a minute.</p>`;
  if (failed) h += `<p class="status-line err">${esc(failed)}</p>`;
  if (list.length) h += `<ul class="sg-list">${list.map(suggestionRow).join('')}</ul>`;
  const nHidden = reviewableSuggestions().hidden.length;
  if (nHidden) h += `<p class="small muted">${nHidden} more ${nHidden === 1 ? 'suggestion is' : 'suggestions are'} hidden because other links already cover ${nHidden === 1 ? 'it' : 'them'}.</p>`;
  if (linkError && linkError.goalId === 'sugg') h += `<p class="status-line err" role="alert">${esc(linkError.msg)}</p>`;

async function ghGet() {
  const r = await fetch(contentsUrl(), { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) { await checkRepo(); return null; }
  if (r.status === 401) throw new SyncError('GitHub rejected the token. It may have expired. Paste a new one in Settings.');
  if (r.status === 403) throw new SyncError(`GitHub refused access (${await ghMessage(r)}). Check the token's repository access.`);
  if (!r.ok) throw new SyncError(`GitHub returned ${r.status}: ${await ghMessage(r)}`);
  const j = await r.json();
  let text;
  if (j.content && j.encoding === 'base64') text = b64dec(j.content);
  else {
    const raw = await fetch(contentsUrl(), { headers: { ...ghHeaders(), Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
    text = await raw.text();
  }
  let data;
  try { data = JSON.parse(text); } catch { throw new SyncError(`${cfg.path} in your data repo isn't valid JSON. Fix or delete it on GitHub, then sync again.`); }
  return { sha: j.sha, data: normalize(data) };
}

async function ghPut(data, sha) {
  const body = { message: `Update from ${cfg.device}`, content: b64enc(JSON.stringify(data, null, 1)) };
  if (sha) body.sha = sha;
  const r = await fetch(contentsUrl(), { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.ok) return { ok: true };
  const msg = await ghMessage(r);
  if (r.status === 409 || (r.status === 422 && /sha/i.test(msg))) return { ok: false, msg };
  if (r.status === 403 || r.status === 404) throw new SyncError('The token can read your data repo but not write to it. Give it "Contents: Read and write" permission.');
  if (r.status === 401) throw new SyncError('GitHub rejected the token. It may have expired. Paste a new one in Settings.');
  throw new SyncError(`GitHub returned ${r.status}: ${msg}`);
}

function setSync(s, msg = '') {
  syncState = s; syncMsg = msg;
  const b = $('#syncBtn');
  b.dataset.s = s;
  const label = {
    off: 'Sync off',
    pending: 'Saving',
    syncing: 'Syncing',
    ok: 'Synced',
    error: 'Sync problem',
    offline: 'Offline',
  }[s] || s;
  b.querySelector('span').textContent = label;
  b.title = msg || label;
  const sl = $('#syncStatus');
  if (sl) { sl.textContent = syncDescription(); sl.classList.toggle('err', s === 'error'); }
}
function syncDescription() {
  if (!syncReady()) return 'Not connected. Your data is saved on this device only.';
  if (syncState === 'error') return syncMsg;
  if (syncState === 'offline') return 'You\'re offline. Changes are saved here and will sync when you\'re back online.';
  if (syncState === 'syncing' || syncState === 'pending') return 'Syncing…';
  if (cfg.lastSync) return `Last synced ${new Date(cfg.lastSync).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}.`;
  return 'Connected.';
}

function scheduleSync(delay = 0) {
  if (!syncReady()) { setSync('off'); return; }
  clearTimeout(syncTimer);
  if (delay) setSync('pending');
  syncTimer = setTimeout(syncNow, delay);
}

async function syncNow() {
  if (!syncReady()) { setSync('off'); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncAgain = false;
  setSync('syncing');
  try {
    let done = false, lastMsg = '';
    for (let attempt = 0; attempt < 4 && !done; attempt++) {
      const remote = await ghGet();
      const merged = remote ? merge(state, remote.data) : state;
      if (stable(merged) !== stable(state)) { state = merged; saveLocal(); requestRender(); }
      if (remote && stable(merged) === stable(remote.data)) { done = true; break; }
      const res = await ghPut(merged, remote && remote.sha);
      if (res.ok) done = true; else lastMsg = res.msg;
    }
    if (!done) throw new SyncError(`Couldn't save to GitHub after several tries (${lastMsg || 'conflict'}). Try Sync now in a minute.`);
    cfg.lastSync = Date.now(); saveCfg();
    setSync('ok');
    // suggestion runs start only after the new goals are saved on GitHub
    if (cfg.jev) {
      let ids = null;
      try {
        if (cfg.pendingSuggest.length) {
          ids = cfg.pendingSuggest.slice();
          cfg.pendingSuggest = []; saveCfg();
          await dispatchSuggest(ids.length === 1 ? ids[0] : '');
          ids = null;
        }
        await fetchSuggestions();
        jevNetFails = 0;
        if (cfg.jevError === NET_ERR) { cfg.jevError = ''; saveCfg(); requestRender(); }
      } catch (e) {
        // A request cut off by a reload, a backgrounded tab or a network blip. Queue any
        // unstarted run again, and only say something if it keeps happening.
        if (ids) { cfg.pendingSuggest = [...new Set([...ids, ...cfg.pendingSuggest])]; saveCfg(); }
        if (++jevNetFails >= 2 && document.visibilityState === 'visible') { cfg.jevError = NET_ERR; saveCfg(); requestRender(); }
      }
    }
  } catch (e) {
    if (e instanceof SyncError) setSync('error', e.message);
    else if (!navigator.onLine) setSync('offline');
    else setSync('error', `Couldn't reach GitHub (${e.message}).`);
  } finally {
    syncing = false;
    if (syncAgain) scheduleSync(500);
  }
}

/* ---------- cloth (heatmap) ---------- */
function clothSVG({ weeks, width, gid = null, cellMax = 22 }) {
  const end = today();
  // days before tracking began aren't missed days, so the cloth starts where you started
  const fam = gid ? family(gid) : null;
  const famMode = !!gid && isRollup(goalById(gid));
  const gs = gid ? [...fam].map(goalById).filter(Boolean) : live('goals');
  const firstDay = gs.length ? gs.map(goalStart).sort()[0] : end;
  const weeksSince = diffDays(weekStart(firstDay), weekStart(end)) / 7 + 1;
  weeks = Math.min(weeks, Math.max(1, weeksSince));
  const start = addDays(weekStart(end), -(weeks - 1) * 7);
  const left = 34, top = 18, gap = 3;
  const cell = clamp(Math.floor((width - left) / weeks) - gap, 6, cellMax);
  const pitch = cell + gap;
  const W = left + weeks * pitch, H = top + 7 * pitch;
  // levels for single-goal mode
  let qs = null;
  if (gid && !famMode) {
    const g = goalById(gid);
    const vals = (IDX.byGoal.get(gid) || []).map(l => l.amount).sort((a, b) => a - b);
    if (g && g.unit !== 'check' && vals.length >= 4) qs = [0.25, 0.5, 0.75].map(p => vals[Math.floor(p * (vals.length - 1))]);
  }
  let out = `<svg class="cloth" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Activity over the last ${weeks} weeks">`;
  ['Mon', '', 'Wed', '', 'Fri', '', 'Sun'].forEach((t, i) => { if (t) out += `<text x="0" y="${top + i * pitch + cell * 0.78}">${t}</text>`; });
  let lastMonth = '';
  for (let w = 0; w < weeks; w++) {
    const ws = addDays(start, w * 7);
    const m = monthKey(addDays(ws, 6));
    if (m !== lastMonth) {
      if (w < weeks - 1 || weeks < 3) out += `<text x="${left + w * pitch}" y="11">${parse(addDays(ws, 6)).toLocaleDateString(undefined, { month: 'short' })}</text>`;
      lastMonth = m;
    }
    for (let d = 0; d < 7; d++) {
      const day = addDays(ws, d);
      if (day < firstDay) continue;
      const x = left + w * pitch, y = top + d * pitch;
      if (day > end) { out += `<rect class="c-empty c-future" x="${x + 0.65}" y="${y + 0.65}" width="${cell - 1.3}" height="${cell - 1.3}" rx="2"/>`; continue; }
      const ls = (IDX.byDate.get(day) || []).filter(l => !fam || fam.has(l.goalId));
      let lvl = 0;
      if (ls.length) {
        if (!gid || famMode) lvl = Math.min(4, ls.length);
        else if (!qs) lvl = 3;
        else { const a = ls[0].amount; lvl = a <= qs[0] ? 1 : a <= qs[1] ? 2 : a <= qs[2] ? 3 : 4; }
      }
      const tipLines = ls.map(l => { const g = goalById(l.goalId); return `${g.name}: ${fmtAmt(g, l.amount)}`; });
      const tip = esc(fmtD(day, { weekday: 'short', month: 'short', day: 'numeric' }) + '\n' + (tipLines.length ? tipLines.join('\n') : 'No check-in'));
      const fresh = freshCell === day ? ' fresh' : '';
      if (lvl) out += `<rect class="h${lvl}${fresh}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2.5" data-tip="${tip}"/>`;
      else out += `<rect class="c-empty" x="${x + 0.65}" y="${y + 0.65}" width="${cell - 1.3}" height="${cell - 1.3}" rx="2" data-tip="${tip}" fill="transparent" style="fill:transparent"/>`;
      if (day === end) out += `<rect class="c-today" x="${x - 2}" y="${y - 2}" width="${cell + 4}" height="${cell + 4}" rx="4" pointer-events="none"/>`;
    }
  }
  return out + '</svg>';
}
function clothLegend(gid) {
  const s = 11;
  let svg = `<svg width="${s * 5 + 16}" height="${s}" aria-hidden="true">`;
  svg += `<rect x="0.6" y="0.6" width="${s - 1.2}" height="${s - 1.2}" rx="2" fill="none" stroke="var(--stitch)" stroke-dasharray="2.6 2" stroke-width="1.2"/>`;

}

/* ---------- cumulative chart ---------- */
function niceStep(max, n = 3) {
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function cumChart(g, width) {
  const end = today();
  const none = g.unit === 'none';
  let start = none ? familyStart(g.id) : goalStart(g);
  if (diffDays(start, end) < 13) start = addDays(end, -13);
  const n = diffDays(start, end) + 1;
  let byDay;
  if (none) {
    // a broad goal's running total counts days when anything linked to it moved
    const ids = family(g.id); byDay = new Map();
    for (const [d, ls] of IDX.byDate) { const k = ls.filter(l => ids.has(l.goalId)).length; if (k) byDay.set(d, k); }
  } else byDay = new Map((IDX.byGoal.get(g.id) || []).map(l => [l.date, l.amount]));
  const scale = g.unit === 'minutes' ? 1 / 60 : 1;
  const cum = [], dates = [];
  let run = 0;
  for (let i = 0; i < n; i++) {
    const d = addDays(start, i);
    const a = byDay.get(d) || 0;
    run += g.unit === 'check' || none ? (a > 0 ? 1 : 0) : a * scale;
    cum.push(run); dates.push(d);
  }
  const W = width, H = 190, L = 40, R = 10, T = 12, B = 26;
  const maxV = Math.max(cum[n - 1], g.unit === 'minutes' ? 1 : 3);
  const step = niceStep(maxV);
  const yMax = Math.ceil(maxV / step) * step;
  const X = i => L + (n === 1 ? 0 : i / (n - 1)) * (W - L - R);
  const Y = v => T + (1 - v / yMax) * (H - T - B);
  let s = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="--g:var(--g${gc(g)})" role="img" aria-label="Running total for ${esc(g.name)}">`;
  s += '<g class="ticks">';
  for (let v = 0; v <= yMax + 1e-9; v += step) {
    const y = Y(v);
    if (v > 0) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    s += `<text x="${L - 8}" y="${y + 4}" text-anchor="end">${+v.toFixed(1)}</text>`;
  }
  s += '</g>';
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<text x="${L}" y="${H - 6}">${fmtD(start)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">Today</text>`;
  const pts = cum.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  s += `<polyline class="line" points="${pts.join(' ')}"/>`;
  const wins = live('wins').filter(w => w.goalId === g.id && w.date >= start && w.date <= end);
  for (const w of wins) {
    const i = diffDays(start, w.date);
    s += `<circle class="ms" cx="${X(i)}" cy="${Y(cum[i])}" r="5" data-tip="${esc(fmtD(w.date) + '\nMilestone: ' + w.text)}"/>`;
  }
  s += `<line class="xhair" x1="0" x2="0" y1="${T}" y2="${Y(0)}"/><circle class="xdot" r="4.5" cx="0" cy="0"/>`;
  s += `<rect class="chart-hit" data-chart="${esc(g.id)}" x="${L}" y="0" width="${W - L - R}" height="${H - B + 4}" fill="transparent"/>`;
  s += '</svg>';
  charts.set(g.id, { g, start, cum, dates, byDay, X, Y, n, L, R, W, wins });
  return s;
}

let newGoalName = '';
function quickLogHTML() {

// compare without case or accents: "cafe", "CAFE" and "Café" all match
const fold = s => (s || '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
function matchScore(g, q) {
  const n = fold(g.name), t = fold(q).trim();
  if (!t) return 0;
  if (n === t) return 100;
  if (n.startsWith(t)) return 80;
  if (n.split(/[^\p{L}\p{N}]+/u).some(w => w.startsWith(t))) return 60;
  if (n.includes(t)) return 40;
  const words = t.split(/\s+/).filter(Boolean);
  if (words.length > 1 && words.every(w => n.includes(w))) return 30;
  if (fold(g.bet).includes(t) || fold(g.why).includes(t)) return 10;

}
// direct connection strength between two goals, 0 to 1
function pairStrength(a, b) {
  let r = 0;
  const L = id => { const l = state.links[id]; return l && !l.deleted ? l : null; };
  for (const l of [L(linkId('contributes', a, b)), L(linkId('contributes', b, a)), L(linkId('mutual', a, b))]) if (l) r = Math.max(r, l.closeness ?? DIRECT);
  const rel = L(linkId('related', a, b)); if (rel) r = Math.max(r, rel.closeness ?? 0.5);

  const dismissed = state.dismissed[pairKey(a, b)];

function hopsFrom(id, max = 4) {

function quickLogResults(goals, checkGoals) {

/* Map of how goals connect. Each goal appears once, under the goal it sits in
   (see placementParent). Its other parents and any goal it supports each way are
   noted under its name instead of repeating it in another branch. Implied links
   are left out entirely. */
function goalMap(goals) {
  const linked = goals.filter(g => parentsOf(g.id).length || childrenOf(g.id).length || mutualOf(g.id).length);
  if (!linked.some(g => directParents(g.id).length || mutualOf(g.id).length)) return '';
  const ids = new Set(linked.map(g => g.id));
  const place = new Map();
  for (const g of linked) { const p = placementParent(g); place.set(g.id, p && ids.has(p.id) ? p.id : null); }
  const kids = new Map();
  for (const [id, p] of place) if (p) { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(goalById(id)); }
  const done = new Set();
  const node = (g, depth) => {
    if (done.has(g.id)) return '';
    done.add(g.id);
    const notes = [];
    const others = directParents(g.id).filter(p => p !== place.get(g.id) && !goalById(p).archived);
    if (others.length) notes.push(`also part of ${goalNames(others)}`);
    const mut = mutualOf(g.id).filter(m => !goalById(m).archived);
    if (mut.length) notes.push(`supports each other with ${goalNames(mut)}`);
    const sub = (kids.get(g.id) || []).sort(byName).map(k => node(k, depth + 1)).join('');
    return `<li style="--g:var(--g${gc(g)})"><button class="mapbtn ${g.completedOn ? 'done' : ''}" data-act="map-open" data-id="${esc(g.id)}"><i></i><span>${esc(g.name)}${g.completedOn ? ' ✓' : ''}</span></button>
      ${notes.length ? `<span class="also">${notes.join('; ')}</span>` : ''}${sub ? `<ul>${sub}</ul>` : ''}</li>`;
  };
  const roots = linked.filter(g => !place.get(g.id)).sort((a, b) => (kids.get(b.id) || []).length - (kids.get(a.id) || []).length || byName(a, b));
  let items = roots.map(r => node(r, 0)).join('');
  // anything left over sits in a loop of links; show it at the top level rather than lose it
  items += linked.filter(g => !done.has(g.id)).map(g => node(g, 0)).join('');
  return `<nav class="gmap" aria-label="How your goals connect"><ul>${items}</ul></nav>`;
}

    const ps = parentsOf(g.id), cs = childrenOf(g.id), ms = mutualOf(g.id), rs = relatedOf(g.id);

    } else h += `<p class="muted small">Link this goal to broader goals it serves, narrower goals that feed it, goals it supports each way, or goals that are just related.</p>`;
    const others = allGoals().filter(o => o.id !== g.id && !o.archived).sort(byName);
    const mine = cfg.jev ? pendingSuggestions(g.id) : [];
    if (mine.length) h += `<p class="small ink2" style="margin:0 0 6px">Suggested by Jev:</p><ul class="sg-list">${mine.map(suggestionRow).join('')}</ul>`;
    if (cfg.jev && syncReady()) h += `<p class="small" style="margin:0 0 10px"><a href="#" data-act="sugg-ask" data-id="${esc(g.id)}">Ask Jev to check this goal again</a></p>`;
    if (others.length) {

        <label class="sr" for="lk-${esc(g.id)}">Link type</label><select id="lk-${esc(g.id)}" name="kind"><option value="parent">Part of</option><option value="child">Made up of</option><option value="mutual">Supports each other with</option><option value="related">Related to</option></select>
        <label class="sr" for="lt-${esc(g.id)}">Goal</label><select id="lt-${esc(g.id)}" name="target">${others.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select>
        <button class="btn" type="submit">Link</button></form>`;

  if (!opts.length) return '';

  return `<fieldset class="f picker"><legend>Part of</legend><small>Broader goals this one feeds into. Pick as many as fit.</small>
    <div class="pick">${opts.map(o => `<label style="--g:var(--g${gc(o)})"><input type="checkbox" name="parents" value="${esc(o.id)}" ${current.has(o.id) ? 'checked' : ''}><span><i></i>${esc(o.name)}</span></label>`).join('')}</div></fieldset>`;
}

function viewReview() {
  const wk = reviewWeek;
  const thisWk = weekStart(today());
  const r = state.reviews[wk] && !state.reviews[wk].deleted ? state.reviews[wk] : {};
  const wkEnd = addDays(wk, 6);
  let h = '<h1>Weekly review</h1>';
  h += `<div class="weeknav"><button class="icon-btn" data-act="wk-prev" aria-label="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <strong>${esc(fmtD(wk))} to ${esc(fmtD(wkEnd))}</strong>${wk === thisWk ? '<span class="muted small">this week</span>' : ''}
    <button class="icon-btn" data-act="wk-next" aria-label="Next week" ${wk >= thisWk ? 'disabled style="opacity:.3"' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>`;

  const goals = allGoals()
    .filter(g => !g.archived || (IDX.byGoal.get(g.id) || []).some(l => l.date >= wk && l.date <= wkEnd))
    .filter(g => g.unit !== 'none' || descendants(g.id).size);
  if (goals.length) {
    let activeCount = 0;
    for (let i = 0; i < 7; i++) if (IDX.byDate.has(addDays(wk, i))) activeCount++;
    h += `<p class="ink2">Checked in on <b>${activeCount} of 7</b> days.</p>`;
    h += `<ul class="wk"><li style="border-bottom:0;padding-bottom:0"><span></span><span class="wk-days-head">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<b>${d}</b>`).join('')}</span><span class="tot small muted">week</span></li>`;
    for (const g of goals) {
      let days = '', total = 0, n = 0;
      const fam = g.unit === 'none' ? family(g.id) : null;
      for (let i = 0; i < 7; i++) {
        const d = addDays(wk, i);
        let a, tipTxt;
        if (fam) {
          const ls = (IDX.byDate.get(d) || []).filter(l => fam.has(l.goalId));
          a = ls.length; tipTxt = ls.map(l => goalById(l.goalId).name).join(', ');
        } else { const l = getLog(d, g.id); a = l ? l.amount || 0 : 0; tipTxt = a > 0 ? fmtAmt(g, a) : ''; }
        if (a > 0) { total += a; n++; }
        days += `<b class="${a > 0 ? 'on' : ''}" title="${esc(fmtD(d, { weekday: 'short' }) + (tipTxt ? ': ' + tipTxt : ''))}"></b>`;
      }
      h += `<li style="--g:var(--g${gc(g)})"><span class="nm"><i></i><span>${esc(g.name)}</span></span><span class="days">${days}</span><span class="tot">${n ? esc(fmtTotal(g, total, n)) : '—'}</span></li>`;
    }
    h += '</ul>';
  }

  h += `<form class="qa" data-form="review" data-week="${wk}" style="margin-top:22px">
    <label class="f"><span>What moved?</span><textarea name="moved" data-act-input="review" data-key="rv-moved">${esc(r.moved || '')}</textarea></label>
    <label class="f"><span>What stalled, and why?</span><textarea name="stalled" data-act-input="review" data-key="rv-stalled">${esc(r.stalled || '')}</textarea></label>
    <label class="f"><span>What's the bet for next week?</span><textarea name="next" data-act-input="review" data-key="rv-next">${esc(r.next || '')}</textarea>
      <small>If a goal's bet changed, update it on <a href="#goals">Goals</a> so dead ends get logged.</small></label>
    <div class="saved-flag" id="savedFlag" aria-live="polite">${hasReviewText(r) ? 'Saved' : ''}</div>
  </form>`;

  const past = live('reviews').filter(x => x.id !== wk && hasReviewText(x)).sort((a, b) => b.id.localeCompare(a.id));
  if (past.length) {
    h += '<h2>Past reviews</h2>';
    for (const p of past.slice(0, 26)) {
      h += `<details class="past"><summary>Week of ${esc(fmtD(p.id, { month: 'short', day: 'numeric', year: 'numeric' }))}</summary><dl>
        ${p.moved ? `<dt>What moved</dt><dd>${esc(p.moved)}</dd>` : ''}${p.stalled ? `<dt>What stalled</dt><dd>${esc(p.stalled)}</dd>` : ''}${p.next ? `<dt>Next bet</dt><dd>${esc(p.next)}</dd>` : ''}
        </dl><button class="btn quiet small" data-act="goto-review" data-week="${esc(p.id)}" style="margin-bottom:12px">Open this week</button></details>`;
    }
  }

  // ideas
  const th = state.settings.ideaThreshold || 20;
  const a30 = activeDays(30);
  const ideas = live('ideas').sort((a, b) => (a.builtOn ? 1 : 0) - (b.builtOn ? 1 : 0) || b.createdAt - a.createdAt);
  const builtThisMonth = ideas.find(i => i.builtOn && monthKey(i.builtOn) === monthKey(today()));
  const unlocked = a30 >= th && !builtThisMonth;
  const nextMonth = parse(today()); nextMonth.setMonth(nextMonth.getMonth() + 1, 1);
  h += `<h2>Ideas for this app</h2>
    <p class="ink2">When you want to change this app, write the idea here instead of building it. You get one build a month, once you've checked in on ${th} of the last 30 days.</p>
    <p class="unlock ${unlocked ? 'yes' : ''}">${builtThisMonth ? `This month's build is used (${esc(builtThisMonth.text)}). The next one opens in ${esc(nextMonth.toLocaleDateString(undefined, { month: 'long' }))}.` : unlocked ? `You've earned this month's build. Pick one idea.` : `${th - a30} more active ${th - a30 === 1 ? 'day' : 'days'} in the last 30 to unlock a build. You're at ${a30}.`}</p>
    <form class="row" data-form="idea"><label class="sr" for="ideaText">New idea</label><input type="text" id="ideaText" name="text" placeholder="A feature or change you want" style="flex:1;min-width:200px"><button class="btn" type="submit">Park it</button></form>`;
  if (ideas.length) {
    h += `<ul class="ideas">${ideas.map(i => `<li class="${i.builtOn ? 'built' : ''}"><span class="txt">${esc(i.text)}<span class="when">${i.builtOn ? `Built ${esc(fmtD(i.builtOn))}` : `Parked ${esc(fmtD(tsDate(i.createdAt)))}`}</span></span>
      ${i.builtOn ? '' : `<button class="btn" data-act="idea-built" data-id="${esc(i.id)}" data-unlocked="${unlocked ? 1 : 0}">Mark built</button>`}
      <button class="icon-btn" data-act="idea-del" data-id="${esc(i.id)}" aria-label="Delete idea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>`).join('')}</ul>`;
  }
  return h;
}
