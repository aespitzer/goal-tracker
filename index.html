      <label class="btn" style="position:relative">Import backup<input type="file" accept="application/json,.json" data-act-change="import" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div>
  `;
}

/* ================= events ================= */
function setAmount(gid, date, amount) {
  amount = Math.max(0, Math.round(amount));
  const k = logKey(date, gid);
  const prev = getLog(date, gid);
  const note = prev ? prev.note || '' : '';
  const wasEmptyDay = !IDX.byDate.has(date);
  if (!amount && !note) { if (prev) remove('logs', k); return; }
  if (amount && wasEmptyDay) freshCell = date;
  put('logs', { id: k, date, goalId: gid, amount, note });
}
// finishing a one-time goal logs that day, so broader goals it feeds get credit for it
function completeGoal(g, date) {
  if (g.unit === 'once') {
    if (g.completedOn && g.completedOn !== date) setAmount(g.id, g.completedOn, 0);
    setAmount(g.id, date, 1);
  }
  put('goals', { ...g, completedOn: date });
}
function reopenGoal(g) {
  if (g.unit === 'once' && g.completedOn) setAmount(g.id, g.completedOn, 0);
  put('goals', { ...g, completedOn: null });
}
function setNote(gid, date, note) {
  const k = logKey(date, gid);
  const prev = getLog(date, gid);
  const amount = prev ? prev.amount || 0 : 0;
  if (!amount && !note.trim()) { if (prev) remove('logs', k); return; }
  put('logs', { id: k, date, goalId: gid, amount, note });
}

const debouncers = new Map();
const debounce = (key, fn, ms) => { clearTimeout(debouncers.get(key)); debouncers.set(key, setTimeout(fn, ms)); };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const g = id ? goalById(id) : null;
  switch (act) {
    case 'day-prev': dayView = addDays(dayView, -1); editAmt = null; render(); break;
    case 'day-next': dayView = addDays(dayView, 1); editAmt = null; render(); break;
    case 'day-today': e.preventDefault(); dayView = today(); render(); break;
    case 'add': if (g) { const l = getLog(dayView, g.id); setAmount(g.id, dayView, (l ? l.amount || 0 : 0) + Number(t.dataset.v)); } break;
    case 'toggle': if (g) { const l = getLog(dayView, g.id); setAmount(g.id, dayView, l && l.amount ? 0 : 1); } break;
    case 'complete': if (g) completeGoal(g, dayView); break;
    case 'uncomplete': if (g) reopenGoal(g); break;
    case 'reopen': if (g) reopenGoal(g); break;
    case 'amt-edit': editAmt = id; render(); break;
    case 'amt-done': { const inp = $(`input[data-act-input="amt"][data-id="${CSS.escape(id)}"]`); editAmt = null; if (inp) setAmount(id, dayView, Number(inp.value) || 0); render(); break; }
    case 'note': {
      const opening = !openNotes.has(id);
      if (opening) openNotes.add(id); else openNotes.delete(id);
      render();
      if (opening) { const ta = $(`#n-${CSS.escape(id)}`); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
      break;
    }
    case 'new-goal': goalForm = 'new'; openGoal = null; if (view !== 'goals') location.hash = '#goals'; else render(); window.scrollTo(0, 0); break;
    case 'goal-cancel': goalForm = null; newGoalName = ''; render(); break;
    case 'open-goal':
      e.preventDefault(); openGoal = id; goalForm = null; linkError = null;
      betForm = t.dataset.setbet ? { goalId: id, outcome: 'edit' } : null;
      if (view !== 'goals') location.hash = '#goals'; else render();
      setTimeout(() => { const el = $(`[data-key="gh-${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: 'start' }); }, 0);
      break;
    case 'map-open':
      openGoal = id; goalForm = null; betForm = null; linkError = null; render();
      { const el = $(`[data-key="gh-${CSS.escape(id)}"]`); if (el) { el.scrollIntoView({ block: 'start' }); el.focus({ preventScroll: true }); } }
      break;
    case 'sugg-add': {
      const s = (sugg.suggestions || {})[t.dataset.pair]; if (!s) break;
      const extra = { score: s.p, source: 'jev' };
      if (s.closeness != null) extra.closeness = s.closeness;
      const err = addLink(s.type, s.from, s.to, extra);
      linkError = err ? { goalId: 'sugg', msg: err } : null;
      if (err) render();
      break;
    }
    case 'sugg-dismiss': put('dismissed', { id: t.dataset.pair }); break;
    case 'tidy-one': { const l = state.links[t.dataset.link]; if (l && !l.deleted) remove('links', l.id); break; }
    case 'tidy-all': tidyImplied(); break;
    case 'qlog-clear': e.preventDefault(); todayQuery = ''; render(); { const el = $('#qlog'); if (el) el.focus(); } break;
    case 'qlog-new': newGoalName = todayQuery.trim(); todayQuery = ''; goalForm = 'new'; openGoal = null; location.hash = '#goals'; break;
    case 'sugg-ask': e.preventDefault(); dispatchSuggest(id); break;
    case 'sugg-all': dispatchSuggest('all'); renderSettings(); break;
    case 'unlink': { const l = state.links[t.dataset.link]; linkError = null; if (l && !l.deleted) remove('links', l.id); break; }
    case 'toggle-goal': openGoal = openGoal === id ? null : id; goalForm = null; betForm = null; linkError = null; render(); break;
    case 'edit-goal': goalForm = id; render(); break;
    case 'archive-goal': if (g) put('goals', { ...g, archived: !g.archived }); break;
    case 'delete-goal':
      if (g && confirm(`Delete "${g.name}" and all of its check-ins, bets and milestones? Archiving keeps the history instead.`)) {
        for (const c of ['logs', 'bets', 'wins']) for (const r of live(c)) if (r.goalId === g.id) state[c][r.id] = { id: r.id, deleted: true, updatedAt: Date.now() };
        for (const l of live('links')) if (l.from === g.id || l.to === g.id) state.links[l.id] = { id: l.id, deleted: true, updatedAt: Date.now() };
        openGoal = null; remove('goals', g.id);
      }
      break;
    case 'bet': betForm = { goalId: id, outcome: t.dataset.o }; render(); { const f = $('form[data-form="bet"] textarea, form[data-form="bet"] input'); if (f) f.focus(); } break;
    case 'bet-cancel': betForm = null; render(); break;
    case 'bet-clear': if (g) put('goals', { ...g, bet: '', betSince: today() }); break;
    case 'bet-del': e.preventDefault(); if (state.bets[t.dataset.bet]) remove('bets', t.dataset.bet); break;
    case 'del-win': e.preventDefault(); remove('wins', id); break;
    case 'pfilter': ui.progressGoal = id; saveUi(); render(); break;
    case 'wk-prev': reviewWeek = addDays(reviewWeek, -7); render(); break;
    case 'wk-next': reviewWeek = addDays(reviewWeek, 7); render(); break;
    case 'goto-review': reviewWeek = t.dataset.week || weekStart(today()); if (view !== 'review') location.hash = '#review'; else { render(); window.scrollTo(0, 0); } break;
    case 'idea-built': {
      const idea = state.ideas[id];
      if (!idea) break;
      if (t.dataset.unlocked !== '1' && !confirm("You haven't unlocked a build this month. Mark it built anyway?")) break;
      put('ideas', { ...idea, builtOn: today() });
      break;
    }
    case 'idea-del': remove('ideas', id); break;
    case 'open-settings': e.preventDefault(); openSettings(); break;
    case 'close-settings': $('#settings').close(); break;
    case 'dismiss-sync-hint': e.preventDefault(); ui.dismissSyncHint = true; saveUi(); render(); break;
    case 'sync-now': syncNow(); break;
    case 'disconnect':
      if (confirm('Remove the token from this device? Your data stays here and on GitHub.')) { cfg.token = ''; saveCfg(); setSync('off'); renderSettings(); }
      break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `stitch-backup-${today()}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      break;
    }
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  const kind = f.dataset.form;
  if (kind === 'goal') {
    const name = (fd.get('name') || '').trim();
    if (!name) return;
    const existing = f.dataset.id ? goalById(f.dataset.id) : null;
    const rec = existing ? { ...existing } : { id: uid(), createdAt: Date.now(), archived: false };
    rec.name = name; rec.horizon = fd.get('horizon') || 'long'; rec.why = (fd.get('why') || '').trim();
    rec.unit = fd.get('unit') || 'minutes'; rec.unitLabel = (fd.get('unitLabel') || '').trim();
    if (fd.get('color') === 'auto') { rec.colorMode = 'auto'; rec.color = rec.color || nextFreeColor(rec.id); }
    else { rec.colorMode = 'manual'; rec.color = Number(fd.get('color')) || 1; }
    if (!existing) { rec.bet = (fd.get('bet') || '').trim(); rec.betSince = today(); requestSuggestions(rec.id); }
    goalForm = null; newGoalName = ''; openGoal = existing ? existing.id : null;
    put('goals', rec);
    // sync "part of" links with the picker
    const want = new Set(fd.getAll('parents'));
    const blocked = new Set([rec.id, ...descendants(rec.id)]);
    for (const p of parentsOf(rec.id)) if (!want.has(p) && !goalById(p).archived) remove('links', linkId('contributes', rec.id, p));
    for (const p of want) if (!blocked.has(p) && !parentsOf(rec.id).includes(p)) addLink('contributes', rec.id, p);
  } else if (kind === 'complete') {
    const g = goalById(f.dataset.id); if (!g) return;
    const d = fd.get('date') || today();
    completeGoal(g, d > today() ? today() : d);
  } else if (kind === 'link') {
    const gid = f.dataset.id, target = fd.get('target'), k = fd.get('kind');
    if (!goalById(gid) || !goalById(target)) return;
    const err = k === 'parent' ? addLink('contributes', gid, target)
      : k === 'child' ? addLink('contributes', target, gid)
      : k === 'mutual' ? addLink('mutual', gid, target)
      : addLink('related', gid, target);
    linkError = err ? { goalId: gid, msg: err } : null;
    render();
  } else if (kind === 'bet') {
    const g = goalById(f.dataset.id); if (!g) return;
    const o = f.dataset.outcome, next = (fd.get('next') || '').trim();
    if (o !== 'edit' && g.bet) {
      put('bets', { id: uid(), goalId: g.id, text: g.bet, start: g.betSince || tsDate(g.createdAt), end: today(), outcome: o, why: (fd.get('why') || '').trim(), lesson: (fd.get('lesson') || '').trim() });
    }
    betForm = null;
    put('goals', { ...g, bet: next, betSince: o === 'edit' && g.bet && next && g.betSince ? g.betSince : today() });
  } else if (kind === 'win') {
    const text = (fd.get('text') || '').trim(); if (!text) return;
    put('wins', { id: uid(), goalId: f.dataset.id, text, date: fd.get('date') || today() });
  } else if (kind === 'idea') {
    const text = (fd.get('text') || '').trim(); if (!text) return;
    put('ideas', { id: uid(), text, createdAt: Date.now(), builtOn: null });
    setTimeout(() => { const i = $('#ideaText'); if (i) i.focus(); }, 0);
  } else if (kind === 'sync') {
    cfg.owner = (fd.get('owner') || '').trim().replace(/^@/, '');
    cfg.repo = (fd.get('repo') || '').trim().replace(/^.*\//, '');
    cfg.token = (fd.get('token') || '').trim();
    saveCfg();
    if (!syncReady()) { setSync('off'); renderSettings(); return; }
    setSync('syncing');
    try {
      const repo = await checkRepo();
      if (repo && repo.private === false) setSync('syncing', '');
      await syncNow();
      renderSettings();
      if (repo && repo.private === false) { const sl = $('#syncStatus'); if (sl) sl.textContent += ' Heads up: this repo is public, so anyone can read your data. Make it private on GitHub.'; }
    } catch (err) { setSync('error', err.message); renderSettings(); }
  }
});

document.addEventListener('input', e => {
  const t = e.target.closest('[data-act-input]');
  if (!t) return;
  const a = t.dataset.actInput;
  if (a === 'note') { const gid = t.dataset.id, date = dayView, v = t.value; debounce('note' + gid, () => setNote(gid, date, v), 700); }
  if (a === 'qlog') {
    todayQuery = t.value;
    const pos = t.selectionStart;
    render();
    const el = $('#qlog'); if (el) { el.focus({ preventScroll: true }); el.setSelectionRange(pos, pos); }
  }
  if (a === 'review') {
    const f = t.closest('form'); const wk = f.dataset.week;
    const flag = $('#savedFlag'); if (flag) flag.textContent = '';
    debounce('review' + wk, () => {
      const fd = new FormData(f);
      const prev = state.reviews[wk] && !state.reviews[wk].deleted ? state.reviews[wk] : {};
      put('reviews', { ...prev, id: wk, moved: fd.get('moved') || '', stalled: fd.get('stalled') || '', next: fd.get('next') || '' });
      const fl = $('#savedFlag'); if (fl) fl.textContent = 'Saved';
    }, 700);
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset && t.dataset.actInput === 'amt' && e.key === 'Enter') { e.preventDefault(); const b = $(`[data-act="amt-done"][data-id="${CSS.escape(t.dataset.id)}"]`); if (b) b.click(); }
  if (t.id === 'qlog') {
    if (e.key === 'Escape') { e.preventDefault(); todayQuery = ''; render(); const el = $('#qlog'); if (el) el.focus(); return; }
    if (e.key === 'Enter') { e.preventDefault(); const b = $('.checkin .gr-ctl button'); if (b) b.focus(); return; }
  }
  // "/" jumps to the quick-log box from anywhere (unless you're typing)
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) && !t.isContentEditable && !$('#settings').open) {
    e.preventDefault();
    const go = () => { const el = $('#qlog'); if (el) { el.focus(); el.select(); } };
    if (view !== 'today') { location.hash = '#today'; setTimeout(go, 0); } else go();
    return;
  }
  // Ctrl+Enter (Cmd+Enter on a Mac) saves a check-in note and closes it
  if (t.dataset && t.dataset.actInput === 'note' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    const gid = t.dataset.id;
    clearTimeout(debouncers.get('note' + gid));
    openNotes.delete(gid);
    t.blur();
    setNote(gid, dayView, t.value);
    render();
    const btn = $(`[data-act="note"][data-id="${CSS.escape(gid)}"]`); if (btn) btn.focus({ preventScroll: true });
  }
});

document.addEventListener('change', e => {
  const t = e.target.closest('[data-act-change]');
  if (!t) return;
  const a = t.dataset.actChange;
  if (a === 'unit') {
    const f = t.closest('form');
    const l = $('[data-unitlabel]', f); if (l) l.hidden = t.value !== 'count';
    const n = $('[data-unithint]', f); if (n) n.textContent = unitHint(t.value);
  }
  if (a === 'device') { cfg.device = t.value.trim() || cfg.device; saveCfg(); }
  if (a === 'jev') { cfg.jev = t.checked; cfg.jevError = ''; saveCfg(); renderSettings(); if (cfg.jev) scheduleSync(0); requestRender(); }
  if (a === 'theme') { cfg.theme = t.value; saveCfg(); applyTheme(); }
  if (a === 'threshold') setSetting('ideaThreshold', clamp(Number(t.value) || 0, 0, 30));
  if (a === 'import') {
    const file = t.files && t.files[0]; if (!file) return;
    file.text().then(txt => {
      try { state = merge(state, JSON.parse(txt)); touched(); alert('Backup merged in.'); }
      catch { alert("That file isn't a Stitch backup."); }
    });
  }
});

/* ---------- tooltips & chart hover ---------- */
const tip = $('#tip');
function showTipAt(text, x, y) {
  const [first, ...rest] = text.split('\n');
  tip.innerHTML = `<b>${esc(first)}</b>${rest.map(esc).join('<br>')}`;
  tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let left = x - r.width / 2, top = y - r.height - 12;
  if (top < 8) top = y + 18;
  left = clamp(left, 8, window.innerWidth - r.width - 8);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { tip.classList.remove('show'); }
function showTipFor(el) { const r = el.getBoundingClientRect(); showTipAt(el.dataset.tip, r.left + r.width / 2, r.top); }
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (t && e.pointerType === 'mouse') showTipFor(t); });
document.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]') && e.pointerType === 'mouse') hideTip(); });
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-tip]');
  if (t) { showTipFor(t); return; }
  if (!e.target.closest('.chart-hit')) hideTip();
});
document.addEventListener('scroll', hideTip, { passive: true });

function chartHover(e) {
  const hit = e.target.closest('.chart-hit');
  if (!hit) return;
  const c = charts.get(hit.dataset.chart); if (!c) return;
  const svg = hit.ownerSVGElement;
  const r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) * (c.W / r.width);
  const i = clamp(Math.round((x - c.L) / (c.W - c.L - c.R) * (c.n - 1)), 0, c.n - 1);
  const cx = c.X(i), cy = c.Y(c.cum[i]);
  svg.classList.add('hover');
  const xh = svg.querySelector('.xhair'); xh.setAttribute('x1', cx); xh.setAttribute('x2', cx);
  const xd = svg.querySelector('.xdot'); xd.setAttribute('cx', cx); xd.setAttribute('cy', cy);
  const g = c.g, d = c.dates[i], day = c.byDay.get(d) || 0;
  const totalTxt = g.unit === 'minutes' ? `${+c.cum[i].toFixed(1)} hours` : g.unit === 'check' ? `${c.cum[i]} days` : g.unit === 'none' ? `${c.cum[i]} active days` : `${c.cum[i]} ${unitWord(g, c.cum[i])}`;
  const dayTxt = g.unit === 'none' ? (day ? `${day} linked ${day === 1 ? 'goal' : 'goals'} active` : 'no activity') : (day ? fmtAmt(g, day) : 'no check-in');
  let txt = `${fmtD(d, { weekday: 'short', month: 'short', day: 'numeric' })}\nRunning total: ${totalTxt}\nThat day: ${dayTxt}`;
  for (const w of c.wins) if (w.date === d) txt += `\nMilestone: ${w.text}`;
  showTipAt(txt, r.left + cx * (r.width / c.W), r.top + cy * (r.width / c.W));
}
document.addEventListener('pointermove', chartHover);
document.addEventListener('pointerdown', chartHover);
document.addEventListener('pointerout', e => {
  const hit = e.target.closest && e.target.closest('.chart-hit');
  if (hit && e.pointerType === 'mouse') { hit.ownerSVGElement.classList.remove('hover'); hideTip(); }
});

/* ---------- routing, theme, lifecycle ---------- */
function route() {
  const v = (location.hash || '#today').slice(1);
  view = ['today', 'progress', 'goals', 'review'].includes(v) ? v : 'today';
  if (view !== 'goals') { goalForm = goalForm === 'new' ? null : goalForm; }
  hideTip();
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => {
  // keep "new goal" request across the hash change
  const keepNew = goalForm === 'new';
  route();
  if (keepNew && view === 'goals') { goalForm = 'new'; render(); }
});

function applyTheme() {
  const t = cfg.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function openSettings() { renderSettings(); $('#settings').showModal(); }
$('#settingsBtn').addEventListener('click', openSettings);
$('#syncBtn').addEventListener('click', openSettings);
$('#settings').addEventListener('click', e => { if (e.target === $('#settings')) $('#settings').close(); });

let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(requestRender, 150); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (dayView !== today() && diffDays(dayView, today()) === 1) dayView = today(); requestRender(); scheduleSync(0); }
  else if (syncReady() && cfg.lastChange > cfg.lastSync) { clearTimeout(syncTimer); syncNow(); }
});
window.addEventListener('online', () => scheduleSync(0));
window.addEventListener('offline', () => syncReady() && setSync('offline'));
window.addEventListener('storage', e => { if (e.key === LS_STATE) { state = normalize(readLS(LS_STATE, null)); requestRender(); } });
setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 5 * 60 * 1000);

// expose for tests
window.__stitch = { merge, stable, get state() { return state; }, set state(s) { state = normalize(s); saveLocal(); render(); }, render, syncNow, cfg };

applyTheme();
route();
setSync(syncReady() ? 'ok' : 'off');
scheduleSync(0);
if (jevWaiting()) pollSuggestions();
})();
</script>
</body>
