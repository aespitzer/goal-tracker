<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tend</title>
<meta name="description" content="Occasional check-ins on habits and reminders, timed to when you actually answer.">
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1612" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --plane: #EDF0EA; --surface: #F9FAF7; --ink: #1B2A21; --ink-2: #46564B; --muted: #63736A;
  --hair: #D3DBD2; --base: #AEBBB1; --accent: #2D6A48; --accent-ink: #FFFFFF; --accent-wash: #DAE8DE;
  --warn-ink: #8A4B0F; --err-ink: #A3261D; --shadow: 0 10px 30px rgba(27,42,33,.16);
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0F1612; --surface: #17201A; --ink: #E3EBE5; --ink-2: #B3C1B7; --muted: #879589;
    --hair: #26322A; --base: #3A4A3F; --accent: #8CCBA2; --accent-ink: #0D1A12; --accent-wash: #1F3326;
    --warn-ink: #E7B07A; --err-ink: #FF8A80; --shadow: 0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0F1612; --surface: #17201A; --ink: #E3EBE5; --ink-2: #B3C1B7; --muted: #879589;
  --hair: #26322A; --base: #3A4A3F; --accent: #8CCBA2; --accent-ink: #0D1A12; --accent-wash: #1F3326;
  --warn-ink: #E7B07A; --err-ink: #FF8A80; --shadow: 0 10px 30px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink); font: 400 17px/1.5 var(--body);
  min-height: 100dvh; padding-bottom: calc(84px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
body.focus { padding-bottom: env(safe-area-inset-bottom); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); } .small { font-size: 15px; }
.err { color: var(--err-ink); }

.top { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--plane) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { font: 750 24px/1 var(--display); letter-spacing: -0.03em; margin-right: auto; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.brand svg { width: 26px; height: 26px; }
.sync { border: 0; background: none; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 6px; cursor: pointer; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--base); }
.sync[data-s="ok"] i { background: #3BA16A; } .sync[data-s="busy"] i { background: #D19A1E; } .sync[data-s="error"] i { background: #D0453B; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--accent-wash); }
.icon-btn svg { width: 22px; height: 22px; }

main { max-width: 560px; margin: 0 auto; padding: 8px 16px 28px; }
h1 { font: 750 clamp(32px, 9vw, 42px)/1.05 var(--display); letter-spacing: -0.03em; margin: 10px 0 16px; }
h2 { font: 700 22px/1.2 var(--display); letter-spacing: -0.015em; margin: 30px 0 10px; }
h3 { font: 700 17px/1.3 var(--display); margin: 22px 0 8px; }
p { margin: 0 0 12px; }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--hair);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); }
.bottom-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.bottom a { text-align: center; text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: 15px; padding: 10px 6px; border-radius: 12px; }
.bottom a[aria-current="page"] { color: var(--ink); background: var(--accent-wash); }
.bottom .add { background: var(--accent); color: var(--accent-ink); padding: 11px 22px; border-radius: 999px; }
body.focus .bottom { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px;
  border: 1.5px solid var(--base); background: var(--surface); font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; background: none; color: var(--accent); padding: 0 10px; }
.btn.danger { color: var(--err-ink); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

label.f { display: block; margin: 0 0 16px; }
label.f > span, .flabel { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
label.f > small, .fhint { display: block; color: var(--muted); font-size: 14px; margin-top: 5px; }
input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%; border: 1.5px solid var(--base); border-radius: 12px; background: var(--surface); padding: 11px 13px; font-size: 17px; min-height: 48px; }
textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }

/* option rows: the main way to answer */
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.opt { width: 100%; text-align: left; min-height: 54px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--hair);
  background: var(--surface); font-size: 18px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt:hover { border-color: var(--base); }
.opt:active { transform: scale(.99); }
.opt small { font-weight: 400; color: var(--muted); font-size: 14px; }
.opt[aria-pressed="true"], .opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.radios { display: grid; gap: 8px; margin: 0 0 16px; }
.radios label { position: relative; }
.radios input { position: absolute; opacity: 0; inset: 0; }
.radios span { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border: 1.5px solid var(--hair); border-radius: 12px; background: var(--surface); font-weight: 700; cursor: pointer; }
.radios span small { font-weight: 400; color: var(--muted); }
.radios input:checked + span { border-color: var(--accent); background: var(--accent-wash); }
.radios input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* check-in card */
.check-top { display: flex; align-items: center; gap: 8px; margin: 4px 0 6px; color: var(--muted); font-size: 15px; }
.check-top .grow { flex: 1; }
.kicker { color: var(--ink-2); font-size: 15px; margin: 18px 0 4px; }
.item-title { font: 750 clamp(30px, 9vw, 40px)/1.08 var(--display); letter-spacing: -0.025em; margin: 0 0 22px; overflow-wrap: anywhere; }
.q { font: 700 20px/1.3 var(--display); margin: 0 0 12px; }
.q-sub { color: var(--ink-2); margin: -6px 0 14px; font-size: 16px; }
.step-in { animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .step-in { animation: none; } }
.skip { display: block; margin: 18px auto 0; }

/* the reminder slider */
.when { font: 750 34px/1.1 var(--display); letter-spacing: -0.02em; margin: 2px 0 14px; min-height: 38px; }
.slider { position: relative; padding: 6px 0 4px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(to right, var(--accent) 0 var(--fill), var(--hair) var(--fill) 100%); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--hair); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin-top: -12px; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 0 4px 18px; font-variant-numeric: tabular-nums; }
.ticks span { width: 0; display: flex; justify-content: center; white-space: nowrap; }
.after { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

/* home list */
.ready { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin: 6px 0 18px; }
.ready b { font: 750 34px/1 var(--display); }
.ready span { flex: 1; font-size: 16px; line-height: 1.3; }
.ready .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.seg { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px 4px; scrollbar-width: none; }
.seg button { flex: none; border: 1.5px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.list li a { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 13px 2px; border-bottom: 1px solid var(--hair); text-decoration: none; color: var(--ink); }
.list .t { font-weight: 700; overflow-wrap: anywhere; }
.list .m { color: var(--ink-2); font-size: 15px; grid-column: 1; }
.list .r { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tag-behind { color: var(--warn-ink); font-weight: 700; }
.empty p { color: var(--ink-2); max-width: 44ch; }

/* insights */
.chart-box { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 14px 10px; }
.chart { display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 400 12px var(--body); }
.chart .lbl { fill: var(--ink); font: 700 14px var(--body); }
.chart .grid { stroke: var(--hair); stroke-width: 1; }
.chart .axis { stroke: var(--base); stroke-width: 1; }
.chart .range { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .target { stroke: var(--ink); stroke-width: 2; }
.chart .bar { fill: var(--accent); }
.chart .bar-untried { fill: none; stroke: var(--base); stroke-dasharray: 3 3; }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend-row svg { vertical-align: -2px; margin-right: 4px; }
.facts { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--hair); }
.facts li { padding: 11px 0; border-bottom: 1px solid var(--hair); }
.facts b { display: block; }
.status-box { border-left: 3px solid var(--accent); background: var(--accent-wash); padding: 10px 14px; border-radius: 0 12px 12px 0; margin: 8px 0 16px; font-size: 15px; }
.status-box.bad { border-color: var(--err-ink); }

/* item detail */
.hist { list-style: none; padding: 0; margin: 0; }
.hist li { padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 15px; display: flex; justify-content: space-between; gap: 12px; }
.hist li span:last-child { color: var(--muted); white-space: nowrap; }

/* settings */
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 16px; margin: 10px 0 18px; }
.panel h3:first-child { margin-top: 0; }
.steps { padding-left: 22px; margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
.steps li { margin-bottom: 6px; }
.keybox { font-family: ui-monospace, Menlo, monospace; font-size: 14px; word-break: break-all; background: var(--plane); border: 1px solid var(--hair); border-radius: 10px; padding: 10px; margin: 8px 0; user-select: all; -webkit-user-select: all; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check-line { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1.5px solid var(--hair); border-radius: 12px; background: var(--surface); font-weight: 700; margin: 0 0 16px; cursor: pointer; }
.check-line input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.check-line small { display: block; font-weight: 400; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--plane); border-radius: 14px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow);
  max-width: calc(100% - 32px); width: max-content; font-size: 15px; transition: opacity .2s, transform .2s; z-index: 40; }
body.focus #toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
#toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
#toast button { border: 0; background: none; color: var(--plane); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 4px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--plane); border-radius: 8px; padding: 7px 10px; font-size: 14px; opacity: 0; max-width: 240px; }
#tip.show { opacity: 1; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" aria-label="Tend, home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 26V14" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/><path d="M16 17c0-4.5-3.2-7-7.5-7 0 4.5 3.2 7 7.5 7Z" fill="var(--accent-ink)"/><path d="M16 14.5c0-4 2.8-6.5 6.8-6.5 0 4-2.8 6.5-6.8 6.5Z" fill="var(--accent-ink)"/></svg>
      Tend
    </a>
    <button class="sync" id="syncBtn" data-s="off" data-act="go" data-to="settings"><i></i><span>Not connected</span></button>
    <button class="icon-btn" data-act="go" data-to="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="bottom" aria-label="Sections">
  <div class="bottom-in">
    <a href="#home">Items</a>
    <a href="#add" class="add">+ Add</a>
    <a href="#insights">Insights</a>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script type="module">
import * as M from './model.js';

/* ================= basics ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function readLS(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } }
function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function stable(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}

const LS_STATE = 'tend.state.v1', LS_CFG = 'tend.cfg.v1', LS_SENT = 'tend.sent.v1';
let state = M.normalizeTend(readLS(LS_STATE, null));
let sent = M.normalizeSent(readLS(LS_SENT, null));
let cfg = Object.assign({ owner: '', repo: 'goal-tracker-data', token: '', deviceId: '', lastSync: 0, lastChange: 0 }, readLS(LS_CFG, {}));
if (!cfg.deviceId) cfg.deviceId = 'd' + Math.random().toString(36).slice(2, 10);
// Reuse Stitch's GitHub connection when it's saved in this browser.
if (!cfg.token) {
  const sc = readLS('stitch.cfg.v1', null);
  if (sc && sc.token && sc.owner) { cfg.owner = sc.owner; cfg.repo = sc.repo || 'goal-tracker-data'; cfg.token = sc.token; }
}
const saveCfg = () => writeLS(LS_CFG, cfg);
saveCfg();
const deviceTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Chicago';
if (!state.settings.updatedAt) state.settings.tz = deviceTz;
const S = () => ({ ...M.DEFAULT_SETTINGS, ...state.settings });

const live = col => Object.values(state[col] || {}).filter(r => r && !r.deleted);
const itemById = id => { const i = state.items[id]; return i && !i.deleted ? i : null; };
function put(col, rec) { rec.updatedAt = Date.now(); state[col][rec.id] = rec; changed(); }
function setSettings(patch) { state.settings = { ...state.settings, ...patch, updatedAt: Date.now() }; changed(); }
function changed() { cfg.lastChange = Date.now(); saveCfg(); writeLS(LS_STATE, state); scheduleSync(1500); requestRender(); }

function pick(a, b) {
  if (!a) return b; if (!b) return a;
  const ua = a.updatedAt || 0, ub = b.updatedAt || 0;
  if (ua !== ub) return ub > ua ? b : a;
  return stable(a) <= stable(b) ? a : b;
}
function merge(a, b) {
  a = M.normalizeTend(a); b = M.normalizeTend(b);
  const out = M.emptyTend();
  for (const c of M.COLS) for (const k of new Set([...Object.keys(a[c]), ...Object.keys(b[c])])) out[c][k] = pick(a[c][k], b[c][k]);
  out.settings = (b.settings.updatedAt || 0) > (a.settings.updatedAt || 0) ? b.settings : a.settings;
  return out;
}

/* ================= GitHub sync ================= */
const syncReady = () => !!(cfg.token && cfg.owner && cfg.repo);
const ghHeaders = () => ({ Authorization: `Bearer ${cfg.token.trim()}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
const repoUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}`;
const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
class SyncError extends Error {}
async function ghMsg(r) { try { return (await r.json()).message || ''; } catch { return ''; } }
async function ghGet(path) {
  const r = await fetch(`${repoUrl()}/contents/${path}`, { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) {
    const rr = await fetch(repoUrl(), { headers: ghHeaders(), cache: 'no-store' });
    if (rr.status === 404) throw new SyncError(`Can't see ${cfg.owner}/${cfg.repo}. Check the name, and that your token has access to it.`);
    if (rr.status === 401) throw new SyncError('GitHub rejected the token. Paste a new one in Settings.');
    return null;
  }
  if (r.status === 401) throw new SyncError('GitHub rejected the token. Paste a new one in Settings.');
  if (!r.ok) throw new SyncError(`GitHub returned ${r.status}: ${await ghMsg(r)}`);
  const j = await r.json();
  let text = j.content ? b64dec(j.content) : null;
  if (text === null) { const raw = await fetch(`${repoUrl()}/contents/${path}`, { headers: { ...ghHeaders(), Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }); text = await raw.text(); }
  return { sha: j.sha, text };
}
async function ghPut(path, text, sha) {
  const body = { message: `Tend: update from ${cfg.deviceId}`, content: b64enc(text) };
  if (sha) body.sha = sha;
  const r = await fetch(`${repoUrl()}/contents/${path}`, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.ok) return true;
  const msg = await ghMsg(r);
  if (r.status === 409 || (r.status === 422 && /sha/i.test(msg))) return false;
  if (r.status === 403 || r.status === 404) throw new SyncError('Your token can read the data repo but not write to it. Give it "Contents: Read and write".');
  throw new SyncError(`GitHub returned ${r.status}: ${msg}`);
}
let syncing = false, again = false, timer = null, syncState = 'off', syncMsg = '';
function setSync(st, msg = '') {
  syncState = st; syncMsg = msg;
  const b = $('#syncBtn'); b.dataset.s = st;
  b.querySelector('span').textContent = { off: 'Not connected', busy: 'Syncing', ok: 'Synced', error: 'Sync problem', offline: 'Offline' }[st] || st;
  b.title = msg || '';
  const el = $('#syncStatus'); if (el) { el.textContent = syncText(); el.className = 'small ' + (st === 'error' ? 'err' : 'muted'); }
}
function syncText() {
  if (!syncReady()) return 'Not connected. Everything stays on this device until you connect.';
  if (syncState === 'error') return syncMsg;
  if (syncState === 'offline') return 'Offline. Changes are saved here and will sync later.';
  return cfg.lastSync ? `Last synced ${new Date(cfg.lastSync).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}.` : 'Connected.';
}
function scheduleSync(ms = 0) {

}
async function syncNow() {
  if (!syncReady()) return setSync('off');
  if (!navigator.onLine) return setSync('offline');
  if (syncing) { again = true; return; }
  syncing = true; again = false; setSync('busy');
  try {
    let done = false;
    for (let i = 0; i < 4 && !done; i++) {
      const remote = await ghGet('tend.json');
      let rdata = null;
      if (remote) { try { rdata = JSON.parse(remote.text); } catch { throw new SyncError('tend.json in your data repo isn\'t valid JSON.'); } }
      const merged = rdata ? merge(state, rdata) : state;
      if (stable(merged) !== stable(state)) { state = merged; writeLS(LS_STATE, state); requestRender(); }
      if (rdata && stable(merged) === stable(M.normalizeTend(rdata))) { done = true; break; }
      done = await ghPut('tend.json', JSON.stringify(merged, null, 1), remote && remote.sha);
    }
    if (!done) throw new SyncError('Couldn\'t save after several tries. Try again in a minute.');
    try {
      const s = await ghGet('tend-sent.json');
      if (s) { const nx = M.normalizeSent(JSON.parse(s.text)); if (stable(nx) !== stable(sent)) { sent = nx; writeLS(LS_SENT, sent); requestRender(); } }
    } catch {}
    // First connection on a fresh data file: record this device's time zone.
    if (!state.settings.updatedAt) setSettings({ tz: deviceTz });
    cfg.lastSync = Date.now(); saveCfg(); setSync('ok');
  } catch (e) {
    if (e instanceof SyncError) setSync('error', e.message);
    else setSync(navigator.onLine ? 'error' : 'offline', `Couldn't reach GitHub (${e.message}).`);
  } finally { syncing = false; if (again) scheduleSync(400); }
}
async function dispatchTest() {
  const r = await fetch(`${repoUrl()}/actions/workflows/tend.yml/dispatches`, {
    method: 'POST', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: 'main', inputs: { mode: 'test' } }) });
  if (r.status === 204 || r.ok) return null;
  if (r.status === 404 || r.status === 403) return 'GitHub wouldn\'t start the test. Check your token has "Actions: Read and write" and the data repo has the Tend workflow.';
  return `GitHub returned ${r.status}: ${await ghMsg(r)}`;
}

const b64u = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));

const now = () => Date.now();

/* ================= routing ================= */
function route() {
  const h = (location.hash || '#home').slice(1);
  const [v, p] = h.split('/');
  view = ['home', 'check', 'add', 'insights', 'settings', 'item'].includes(v) ? v : 'home';
  param = p ? decodeURIComponent(p) : '';
  if (view === 'check' && !queue.length) startQueue(dueQueue());
  if (view !== 'add') { addKind = null; bulk = false; }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function go(v) { if (location.hash === '#' + v) route(); else location.hash = '#' + v; }

function dueQueue() {
  const t = now();
  return M.dueItems(state, t).map(i => ({ i, p: M.priority(i, state, t) })).sort((a, b) => b.p - a.p).map(x => x.i.id);
}

// Opened from a notification: record when, then show its items.
function openFromUrl(href) {
  const u = new URL(href, location.href);
  const nid = u.searchParams.get('n');
  const ids = (u.searchParams.get('i') || '').split(',').map(decodeURIComponent).filter(Boolean);
  if (nid && !state.opens[nid]) put('opens', { id: nid, at: now() });
  if (u.search) history.replaceState(null, '', location.pathname + (u.hash || (ids.length ? '#check' : '#home')));
  if (ids.length) { startQueue(ids, nid); if (!queue.length) startQueue(dueQueue()); go('check'); }
  else if (u.hash) go(u.hash.slice(1));
}

let renderedView = '';
function captureForms() {
  const out = {};
  for (const f of $$('#app form[data-form]')) {
    const key = f.dataset.form + ':' + (f.dataset.id || '');
    out[key] = [...f.elements].filter(el => el.name || el.id).map(el => ({
      sel: el.id ? '#' + CSS.escape(el.id) : `[name="${CSS.escape(el.name)}"]${el.type === 'radio' ? `[value="${CSS.escape(el.value)}"]` : ''}`,
      type: el.type, value: el.value, checked: el.checked,
    }));
  }
  return out;
}
function restoreForms(keep) {
  for (const f of $$('#app form[data-form]')) {
    const saved = keep[f.dataset.form + ':' + (f.dataset.id || '')];
    if (!saved) continue;
    for (const s of saved) {
      const el = f.querySelector(s.sel);
      if (!el || el.type === 'submit' || el.type === 'button') continue;
      if (s.type === 'checkbox' || s.type === 'radio') el.checked = s.checked;
      else el.value = s.value;
    }
  }

}

function answerHabit(kind, v) {

  if (kind === 'last') {

    card.verdict = M.judge(bounds, M.targetOf(card.snapshot.target).perDay);
    card.answerId = uid();
    card.ans = { id: card.answerId, itemId: it.id, nid: currentNid, at: t, kind: 'habit', last: v, verdict: card.verdict, target: card.snapshot.target };
    card.askFeel = M.shouldAskFeeling(card.verdict);
    card.askAuto = M.shouldAskAuto(card.snapshot, live('answers'), card.verdict);
  } else if (kind === 'feel') card.ans.feel = v;
  else if (kind === 'auto') card.ans.auto = v;
  put('answers', { ...card.ans });
  const { item, notes } = M.updateHabit(card.snapshot, { verdict: card.verdict, feel: card.ans.feel, auto: card.ans.auto }, t);
  state.items[it.id] = { ...item, updatedAt: Date.now() };

  if (card && card.notes) {
    if (card.notes.includes('target-down')) msg = `Saved, and changed the aim to ${M.targetOf(item.target).short}.`;
    if (card.notes.includes('target-up')) msg = `Saved, and raised the aim to ${M.targetOf(item.target).short}.`;

function parseLine(line) {
  let s = line.trim();
  if (!s) return null;
  if (/^[-*+]\s*\[[xX]\]/.test(s)) return null;
  s = s.replace(/^[-*+]\s*(\[\s?\]\s*)?/, '').replace(/^\d+[.)]\s+/, '').trim();
  let addedOn = null, m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})[\s:–-]+/.exec(s))) { addedOn = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; s = s.slice(m[0].length); }
  else if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s:–-]+/.exec(s))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; addedOn = `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; s = s.slice(m[0].length); }
  s = s.trim();
  return s ? { text: s.slice(0, 140), addedOn } : null;
}

function chartW() { return Math.max(280, Math.min(528, $('#app').clientWidth - 32 - 30)); }
// One row per habit: estimated sessions per week (dot, with an 80% range) against the aim (tick).
function forestChart(rows) {
  const W = chartW(), L = 4, R = 8, rowH = 46, top = 6, axisH = 42;
  const H = top + rows.length * rowH + axisH;
  const lo = Math.log10(0.1), hi = Math.log10(10);
  const X = v => L + (Math.log10(Math.min(10, Math.max(0.1, v))) - lo) / (hi - lo) * (W - L - R);
  let s = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="How often you do each habit compared with your aim">`;
  const ticks = [[0.25, '¼'], [0.5, '½'], [1, '1'], [2, '2'], [4, '4'], [7, '7']];
  for (const [v, l] of ticks) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${top}" y2="${H - axisH}"/><text x="${X(v)}" y="${H - axisH + 16}" text-anchor="middle">${l}</text>`;
  s += `<text x="${(W - R + L) / 2}" y="${H - 4}" text-anchor="middle">times per week</text>`;
  rows.forEach(({ it, post }, k) => {
    const y = top + k * rowH;
    const tgt = M.targetOf(it.target).perDay * 7, m = post.median * 7;
    const tip = `${it.text}\nAbout ${(m).toFixed(m < 1 ? 1 : 0)} a week (80% range ${(post.lo * 7).toFixed(1)}–${(post.hi * 7).toFixed(1)})\nAim: ${M.targetOf(it.target).label.toLowerCase()}`;
    if (rows.length > 1) s += `<text class="lbl" x="${L}" y="${y + 14}">${esc(it.text.length > 38 ? it.text.slice(0, 37) + '…' : it.text)}</text>`;
    const cy = y + (rows.length > 1 ? 30 : 22);
    s += `<line class="range" x1="${X(post.lo * 7)}" x2="${X(post.hi * 7)}" y1="${cy}" y2="${cy}"/>`;
    s += `<line class="target" x1="${X(tgt)}" x2="${X(tgt)}" y1="${cy - 9}" y2="${cy + 9}"/>`;
    s += `<circle class="dot" cx="${X(m)}" cy="${cy}" r="6"/>`;
    s += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  s += '</svg>';
  return `<div class="chart-box">${s}<div class="legend-row"><span><svg width="14" height="12"><circle cx="7" cy="6" r="5" fill="var(--accent)"/></svg>Your estimated rate</span><span><svg width="22" height="12"><line x1="1" x2="21" y1="6" y2="6" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>Likely range</span><span><svg width="8" height="14"><line x1="4" x2="4" y1="1" y2="13" stroke="var(--ink)" stroke-width="2"/></svg>Your aim</span></div></div>`;
}
function hourChart(model, s) {
  const hours = [];
  for (let h = Math.ceil(s.wakeStart); h < s.wakeEnd; h++) hours.push(h % 24);
  const W = chartW(), L = 34, R = 4, T = 8, B = 24, H = 170;
  const bw = (W - L - R) / hours.length;
  const Y = v => T + (1 - v) * (H - T - B);
  let svg = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chance you answer within two hours, by hour">`;
  for (const v of [0, 0.5, 1]) svg += `<line class="${v ? 'grid' : 'axis'}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`;
  hours.forEach((h, i) => {
    const m = model[h], x = L + i * bw + 2, w = Math.max(2, bw - 4);
    const lab = h === 0 ? '12a' : h < 12 ? h + 'a' : h === 12 ? '12p' : (h - 12) + 'p';
    const tip = `${lab}\n${m.n ? `${m.n} ${m.n === 1 ? 'ping' : 'pings'} sent here\nabout ${Math.round(m.mean * 100)}% answered within 2 hours` : 'Not tried yet'}`;
    if (m.n) svg += `<rect class="bar" x="${x}" y="${Y(m.mean)}" width="${w}" height="${Math.max(1, Y(0) - Y(m.mean))}" rx="3"/>`;
    else svg += `<rect class="bar-untried" x="${x + .5}" y="${Y(m.mean)}" width="${w - 1}" height="${Math.max(1, Y(0) - Y(m.mean))}" rx="3"/>`;
    if (i % Math.ceil(hours.length / 7) === 0) svg += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
    svg += `<rect x="${x - 2}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  return `<div class="chart-box">${svg}</div>`;
}
function bestHour(model, s) {
  let best = null;
  for (let h = Math.ceil(s.wakeStart); h < s.wakeEnd; h++) { const m = model[h % 24]; if (m.n >= 2 && (!best || m.mean > best.mean)) best = m; }
  if (!best) return null;
  const h = best.h; return h === 0 ? '12am' : h < 12 ? h + 'am' : h === 12 ? 'noon' : (h - 12) + 'pm';
}

  if (mm.group.sends + mm.spread.sends) h += `<li><b>Grouped or one at a time</b>Grouped pings: ${Math.round(mm.group.mean * 100)}% of items answered (${mm.group.sends} sent). One at a time: ${Math.round(mm.spread.mean * 100)}% (${mm.spread.sends} sent).</li>`;

  const others = Object.values(state.devices).filter(d => d && !d.deleted && d.vapid === s.vapidPublic);
  h += `<p class="flabel" style="margin-top:18px">3. Send a test</p>
    <p class="small ink2">Asks your data repo to send one now. It takes about a minute to arrive.${others.length ? ` Goes to ${others.length} ${others.length === 1 ? 'device' : 'devices'}.` : ''}</p>
    <button class="btn" data-act="test" ${keysOk && others.length && syncReady() ? '' : 'disabled'}>Send a test notification</button>
    ${testMsg ? `<p class="small ${/^GitHub/.test(testMsg) ? 'err' : 'muted'}" style="margin-top:8px">${esc(testMsg)}</p>` : ''}
    ${sent.status ? `<p class="small ${sent.status.ok ? 'muted' : 'err'}" style="margin-top:8px">Sender: ${esc(sent.status.message)} (${esc(new Date(sent.status.at).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' }))})</p>` : ''}
  </div>`;

  h += `<div class="panel"><h3>When to reach you</h3>
    <div class="two">
      <label class="f"><span>From</span><select data-act-change="wakeStart">${hourOpts(s.wakeStart, 6, 14)}</select></label>
      <label class="f"><span>Until</span><select data-act-change="wakeEnd">${hourOpts(s.wakeEnd, 18, 27)}</select></label>
    </div>
    <p class="small ink2">Nothing is sent outside these hours. Within them, Tend tries different times and learns when you answer. Time zone: ${esc(s.tz)}${s.tz !== deviceTz ? ` <button class="btn quiet" data-act="use-tz" style="min-height:0;padding:0">Use ${esc(deviceTz)}</button>` : ''}.</p>
    <div class="two">
      <label class="f"><span>Pings a day to start</span><select data-act-change="budgetStart">${[1, 2, 3, 4, 5].map(n => `<option ${n === s.budgetStart ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="f"><span>Never more than</span><select data-act-change="budgetMax">${[2, 3, 4, 5, 6, 8].map(n => `<option ${n === s.budgetMax ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>
    <label class="f"><span>Weekly summary</span><select data-act-change="digestDay">${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map((d, i) => `<option value="${i}" ${i === s.digestDay ? 'selected' : ''}>${d}</option>`).join('')}</select><small>Sent in the first ping of that day: which habits need the most help.</small></label>
  </div>`;
  h += `<div class="panel"><h3>Backup</h3><button class="btn" data-act="export">Download everything</button></div>`;
  return h;
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'go': e.preventDefault(); go(t.dataset.to); break;
    case 'undo': $('#toast').classList.remove('show'); if (toastUndo) { const u = toastUndo; toastUndo = null; u(); } break;
    case 'check-due': startQueue(dueQueue()); go('check'); break;
    case 'check-one': startQueue([id]); go('check'); break;
    case 'close-check': queue = []; card = null; break;
    case 'skip': qi++; card = null; render(); break;
    case 'last': case 'feel': case 'auto': answerHabit(a, t.dataset.v); break;
    case 'remind': case 'r-done': case 'r-remove': answerReminder(a); break;
    case 'filter-kind': filter.kind = t.dataset.k; render(); break;
    case 'filter-list': filter.list = filter.list === t.dataset.l ? 'all' : t.dataset.l; render(); break;
    case 'toggle-finished': filter.finished = !filter.finished; render(); break;
    case 'bulk': e.preventDefault(); bulk = true; if (view !== 'add') location.hash = '#add'; else render(); break;
    case 'restore': { const it = itemById(id); put('items', { ...it, status: 'active', closedAt: null, dueAt: it.kind === 'reminder' && (it.dueAt || 0) < now() ? now() : it.dueAt }); break; }
    case 'item-done': case 'item-remove': {
      const it = itemById(id), prev = { ...it };
      put('items', { ...it, status: a === 'item-done' ? 'done' : 'removed', closedAt: now() });
      put('answers', { id: uid(), itemId: id, at: now(), kind: it.kind, action: a === 'item-done' ? 'done' : 'remove' });
      toast(a === 'item-done' ? 'Marked done.' : 'Removed.', () => { state.items[id] = { ...prev, updatedAt: Date.now() }; changed(); });
      go('home'); break;
    }
    case 'switch-kind': switching = switching === id ? null : id; render(); break;
    case 'make-keys': case 'new-keys':
      if (a === 'new-keys' && !confirm('New keys mean every device has to turn notifications on again, and you replace the secret in GitHub. Continue?')) break;
      await makeKeys(); render(); break;
    case 'copy-key': try { await navigator.clipboard.writeText(pendingKeys.priv); toast('Copied.'); } catch { toast('Select the key and copy it by hand.'); } break;
    case 'keys-saved': setSettings({ vapidPublic: pendingKeys.pub }); pendingKeys = null; toast('Keys saved. Now turn on notifications on your phone.'); break;
    case 'push-on': pushMsg = ''; try { await enablePush(); toast('Notifications are on for this device.'); } catch (err) { pushMsg = err.message; } render(); break;
    case 'push-off': await disablePush(); render(); break;
    case 'test': testMsg = 'Asking GitHub…'; render(); await syncNow(); testMsg = (await dispatchTest()) || 'Sent the request. A notification should arrive in about a minute.'; render(); setTimeout(() => syncNow(), 75000); break;
    case 'use-tz': setSettings({ tz: deviceTz }); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ tend: state, sent }, null, 1)], { type: 'application/json' });
      const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = `tend-backup-${new Date().toISOString().slice(0, 10)}.json`; l.click();
      setTimeout(() => URL.revokeObjectURL(l.href), 2000); break;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act-change]');
  if (!t) return;
  const a = t.dataset.actChange;
  if (a === 'habit') { addKind = t.checked ? 'habit' : null; render(); return; }
  if (a === 'edit') {
    const f = t.closest('form'), it = itemById(f.dataset.id); if (!it) return;
    const text = f.text.value.trim(); if (!text) return;
    put('items', { ...it, text: text.slice(0, 140), list: f.list.value.trim() });
    toast('Saved.'); return;
  }
  if (a === 'target') { const it = itemById(t.dataset.id); put('items', { ...it, target: t.value }); return; }
  if (['wakeStart', 'wakeEnd', 'budgetStart', 'budgetMax', 'digestDay'].includes(a)) {
    let v = Number(t.value);
    const s = S(), patch = { [a]: v };
    if (a === 'wakeEnd' && v - s.wakeStart < 4) { toast('Keep at least four hours between start and end.'); render(); return; }
    if (a === 'wakeStart' && s.wakeEnd - v < 4) { toast('Keep at least four hours between start and end.'); render(); return; }
    if (a === 'budgetStart' && v > s.budgetMax) patch.budgetMax = v;
    if (a === 'budgetMax' && v < s.budgetStart) patch.budgetStart = v;
    setSettings(patch);
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), k = f.dataset.form, t = now();
  if (k === 'add') {
    const text = (fd.get('text') || '').trim().replace(/\s+/g, ' ');
    if (!text) return;
    const base = { id: uid(), text: text.slice(0, 140), list: (fd.get('list') || '').trim(), createdAt: t, addedOn: M.zDate(t, S().tz), status: 'active' };
    if (fd.get('habit')) {
      const stage = fd.get('stage') || 'new';
      put('items', { ...base, kind: 'habit', target: fd.get('target') || 'daily', stage, nextDue: t + M.stageOf(stage).interval * M.DAY });
      toast(`Added. First check-in ${M.stageOf(stage).interval === 1 ? 'tomorrow' : 'in a few days'}.`);
    } else {
      const choice = M.REMIND_CHOICES[+$('#sl-first').value];
      const d = M.reminderDue(choice.id, t, S());
      put('items', { ...base, kind: 'reminder', dueAt: d.dueAt, timed: d.timed, lastChoice: choice.id });
      toast(`Added. Back ${d.timed ? 'soon' : 'around ' + fmtDay(d.dueAt)}.`);
    }
    addKind = null; go('home');
  } else if (k === 'bulk') {
    const lines = (fd.get('lines') || '').split('\n').map(parseLine).filter(Boolean);
    if (!lines.length) return toast('Nothing to add.');
    const list = (fd.get('list') || '').trim(), spread = Number(fd.get('spread')) || 30, s = S();
    lines.forEach((l, n) => {
      const day = 1 + Math.floor(Math.random() * spread);
      const id = 'i' + uid() + n;
      state.items[id] = { id, text: l.text, list, kind: 'reminder', createdAt: t, addedOn: l.addedOn || M.zDate(t, s.tz), status: 'active',
        dueAt: M.zTime(M.addDaysStr(M.zDate(t, s.tz), day), s.wakeStart, s.tz), timed: false, lastChoice: 'weeks', updatedAt: Date.now() };
    });
    changed();
    toast(`Added ${lines.length}. They'll come back over the next ${spread === 14 ? 'two weeks' : spread === 30 ? 'month' : spread === 90 ? 'three months' : 'six months'}.`);
    bulk = false; go('home');
  } else if (k === 'to-habit') {
    const it = itemById(f.dataset.id), stage = fd.get('stage') || 'new';
    put('items', { ...it, kind: 'habit', target: fd.get('target') || 'daily', stage, interval: undefined, ease: undefined, nextDue: t + M.stageOf(stage).interval * M.DAY });
    switching = null; toast('Now tracking it as a habit.');
  } else if (k === 'to-reminder') {
    const it = itemById(f.dataset.id), choice = M.REMIND_CHOICES[+$('#sl-switch').value], d = M.reminderDue(choice.id, t, S());
    put('items', { ...it, kind: 'reminder', dueAt: d.dueAt, timed: d.timed, lastChoice: choice.id });
    switching = null; toast('Now a reminder.');
  } else if (k === 'sync') {
    cfg.owner = (fd.get('owner') || '').trim().replace(/^@/, '');
    cfg.repo = (fd.get('repo') || '').trim().replace(/^.*\//, '');
    cfg.token = (fd.get('token') || '').trim();
    saveCfg(); await syncNow(); render();
  }
});

// tap-to-show tooltips on charts
const tip = $('#tip');
function showTip(el, x, y) {
  const [a, ...rest] = el.dataset.tip.split('\n');
  tip.innerHTML = `<b>${esc(a)}</b>${rest.length ? '<br>' + rest.map(esc).join('<br>') : ''}`;
  tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width / 2)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 12) + 'px';
}
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el, e.clientX, e.clientY); });
document.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]') && e.pointerType === 'mouse') tip.classList.remove('show'); });
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show'); });
addEventListener('scroll', () => tip.classList.remove('show'), { passive: true });

/* ================= lifecycle ================= */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { lastBadge = null; scheduleSync(0); requestRender(); }
  else if (syncReady() && cfg.lastChange > cfg.lastSync) { clearTimeout(timer); syncNow(); }
});
addEventListener('online', () => scheduleSync(0));
setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 5 * 60e3);
// Only the chart views depend on width.
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === 'insights' || view === 'item') requestRender(); }, 150); });

window.__tend = { get state() { return state; }, set state(v) { state = M.normalizeTend(v); writeLS(LS_STATE, state); render(); }, get sent() { return sent; }, set sent(v) { sent = M.normalizeSent(v); writeLS(LS_SENT, sent); render(); }, syncNow, cfg, M };

setSync(syncReady() ? 'ok' : 'off');
if (location.search.includes('n=') || location.search.includes('i=')) openFromUrl(location.href);
else route();
scheduleSync(0);
</script>
